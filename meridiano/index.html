 for(let i=0;i<=8;i++){s+=`<line x1="${40+i*65}" y1="30" x2="${40+i*65}" y2="570" stroke="#0E1A22" />`;s+=`<line x1="40" y1="${30+i*67.5}" x2="560" y2="${30+i*67.5}" stroke="#0E1A22"/>`}

 [90,180,270].forEach(r=>s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#123326" stroke-dasharray="2 4"/>`);
 s+=`<g transform="translate(${cx},${cy})"><g id="sweep"><path d="M0 0 L340 0 A340 340 0 0 0 ${340*Math.cos(-0.6)} ${340*Math.sin(-0.6)} Z" fill="url(#sw)"/><line x1="0" y1="0" x2="340" y2="0" stroke="#3CFFA0" stroke-opacity=".6"/></g></g>`;

 // agrupa pontos muito próximos (São Paulo) em leque
 const grupos={};vis.forEach(e=>{const k=Math.round(px(e.lng)/14)+'_'+Math.round(py(e.lat)/14);(grupos[k]=grupos[k]||[]).push(e)});
 Object.values(grupos).forEach(g=>g.forEach((e,i)=>{let x=px(e.lng),y=py(e.lat);if(g.length>1){const a=i/g.length*Math.PI*2;x+=Math.cos(a)*(10+g.length*1.6);y+=Math.sin(a)*(10+g.length*1.6)}e._x=x;e._y=y}));

 const sel=E.find(e=>e.id==SEL&&vis.includes(e));if(sel)s+=`<text text-anchor="${sel._x>380?'end':'start'}" x="${sel._x>380?sel._x-12:sel._x+12}" y="${sel._y-10}" fill="#3CFFA0" font-size="12" font-family="IBM Plex Mono">${esc(sel.n)}</text>`;
 $('map').innerHTML=s;
 const sw=document.getElementById('sweep');let a=0;cancelAnimationFrame(mapa._r);(function rod(){a=(a+0.6)%360;sw&&sw.setAttribute('transform',`rotate(${a})`);mapa._r=requestAnimationFrame(rod)})();

}

function linha(e){return `<div class="row" data-abrir="${e.id}"><div><div class="nm">${esc(e.n)} ${e.g?'<span class="pill g">GATILHO</span>':''}</div><div class="sub"><span class="flag ${e.p}">${PN[e.p].toUpperCase()}</span> ${esc(e.set)} · ${esc(e.tipo)} · ${e.st}${e.tel?' · '+esc(e.tel):''}</div></div><div class="score">${e.sc}</div></div>`}
function base(){const v=E.filter(e=>(FP=='todos'||e.p==FP)&&casa(e)).sort((a,b)=>b.sc-a.sc);$('nBase').textContent=v.length;
 $('base').innerHTML=`<div class="ferr"><button class="a" id="csvBase">Baixar planilha (CSV) para o CRM</button></div>`+(v.map(linha).join('')||'<div class="vazio">NENHUMA EMPRESA NESSE FILTRO</div>')+`<div class="nota">Endereços e telefones: Google Maps, consulta de 24/10/2026. A nota (0–100) combina tamanho da operação no Brasil, existência de gatilho recente e volume de trabalho jurídico típico do setor.</div>`}
function chegando(){$('nCh').textContent=CH.length;
 $('chegando').innerHTML=`<p style="color:var(--mu);margin:0 0 10px">Empresas que anunciaram dinheiro no Brasil e ainda não têm estrutura confirmada aqui. É o momento em que mais precisam de escritório local: abrir empresa, escolher estado, negociar incentivos, contratar.</p>`+
 CH.map(c=>`<div class="chega"><div class="t"><div class="nm">${esc(c.n)}</div><div class="v">${esc(c.v)}</div></div><div class="sub" style="margin:2px 0 6px">${esc(c.set)}</div><p style="margin:0 0 6px">${esc(c.o)}</p><div class="sec" style="margin:0 0 6px"><h4>Ângulo jurídico</h4><p>${esc(c.ang)}</p></div><div class="acts"><a class="a hot" target="_blank" rel="noopener" href="${li(c.n.replace(/\s*\(.*\)/,'')+' Brazil')}">Quem cuida do Brasil (LinkedIn)</a><a class="a" target="_blank" rel="noopener" href="${gnews(c.n.replace(/\s*\(.*\)/,'')+' Brasil')}">Notícias</a><a class="a" target="_blank" rel="noopener" href="${S[c.s][1]}">Fonte: ${esc(S[c.s][0])}</a></div></div>`).join('')}
function sinais(){$('sinais').innerHTML=SIN.map(x=>`<div class="sinal"><div class="d">${x.d}</div><div>${esc(x.t)}</div><div class="acts" style="margin-top:4px"><a class="a" target="_blank" rel="noopener" href="${S[x.s][1]}">Fonte: ${esc(S[x.s][0])}</a>${x.e?`<button class="a" data-abrir="${x.e}">Ver empresa</button>`:''}</div></div>`).join('')}
function lista(){const v=E.filter(e=>LISTA.has(e.id));$('nLista').textContent=v.length;
 $('lista').innerHTML=v.length?`<div class="ferr"><button class="a" id="csvLista">Baixar minha lista (CSV)</button></div>`+v.map(linha).join(''):'<div class="vazio">ABRA UM DOSSIÊ E TOQUE EM<br>"ADICIONAR À MINHA LISTA".</div>'}
function csv(rows,nome){const cab=['Empresa','País','Setor','Estado','Tipo','Endereço','Telefone','Site','Nota','Gatilho','Ângulo jurídico'];
 const L=[cab,...rows.map(e=>[e.n,PN[e.p],e.set,e.st,e.tipo,e.end,e.tel,e.site,e.sc,e.g||'',ANG[e.ang]])].map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+L],{type:'text/csv'}));a.download=nome;a.click();toast('Planilha baixada')}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-abrir],[data-lista],#csvBase,#csvLista,.tabs button');if(!t)return;
 if(t.matches('.tabs button'))return aba(t.dataset.t);
 if(t.dataset.abrir)return abrir(t.dataset.abrir);
 if(t.dataset.lista){const id=t.dataset.lista;LISTA.has(id)?LISTA.delete(id):LISTA.add(id);salvar();dossie();lista();toast(LISTA.has(id)?'Adicionada à sua lista':'Removida da lista');return}
 if(t.id=='csvBase')csv(E.filter(e=>(FP=='todos'||e.p==FP)&&casa(e)),'meridiano-base.csv');
 if(t.id=='csvLista')csv(E.filter(e=>LISTA.has(e.id)),'meridiano-minha-lista.csv')});
function aba(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==t))}
function tudo(){filtros();mapa();base();chegando();sinais();lista();dossie()}
SEL='byd';tudo();
</script>
</body>
</html>
