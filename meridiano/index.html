<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridiano · Radar de capital estrangeiro</title>
<meta name="description" content="Meridiano: mapa vivo das empresas de 14 países que mais investem no Brasil, por estado, com gatilhos, ângulo jurídico e caminho até quem decide.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<div class="top">
 <div class="brand"><i></i>MERIDIANO</div>
 <div class="live" id="relogio"></div>
 <label class="busca"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7D8EA3" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Buscar empresa, setor, cidade, estado…" autocomplete="off" aria-label="Buscar"><kbd>/</kbd></label>
</div>
<div class="ticker"><div id="tick"></div></div>
<div class="para" id="para"></div>
<div class="fbar" id="filtros" aria-label="Filtrar por país"></div>

<div class="main">
 <div class="radar" id="radar">
  <svg id="map" viewBox="0 0 600 610" preserveAspectRatio="xMidYMid meet" aria-label="Mapa do Brasil por estado com as empresas estrangeiras"></svg>
  <div class="hud" id="hud"></div>
  <div class="zoom"><button id="zin" aria-label="Aproximar">+</button><button id="zout" aria-label="Afastar">−</button><button id="zres" aria-label="Ver o Brasil todo" style="font-size:12px">⤢</button></div>
  <div class="leg" id="leg"></div>
  <button class="ufchip" id="ufchip"></button>
  <div class="tip" id="tip"></div>
 </div>
 <button class="vermais" id="vermais">▼ VER AS EMPRESAS E OS DOSSIÊS</button>
 <div class="side" id="side">
  <div class="tabs" id="tabs" role="tablist" aria-label="Seções">
   <button role="tab" aria-controls="dossie" aria-selected="true" data-t="dossie" class="on">DOSSIÊ</button>
   <button role="tab" aria-controls="paises" aria-selected="false" data-t="paises">PAÍSES<span class="n" id="nPa">0</span></button>
   <button role="tab" aria-controls="chegando" aria-selected="false" data-t="chegando">CHEGANDO<span class="n" id="nCh">0</span></button>
   <button role="tab" aria-controls="base" aria-selected="false" data-t="base">BASE INSTALADA<span class="n" id="nBase">0</span></button>
   <button role="tab" aria-controls="sinais" aria-selected="false" data-t="sinais">SINAIS<span class="n" id="nSi">0</span></button>
   <button role="tab" aria-controls="lista" aria-selected="false" data-t="lista">MINHA LISTA<span class="n" id="nLista">0</span></button>
  </div>
  <div class="pane on" id="dossie" role="tabpanel"></div>
  <div class="pane" id="paises" role="tabpanel"></div>
  <div class="pane" id="chegando" role="tabpanel"></div>
  <div class="pane" id="base" role="tabpanel"></div>
  <div class="pane" id="sinais" role="tabpanel"></div>
  <div class="pane" id="lista" role="tabpanel"></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js?v=4"></script>
<script src="app.js?v=4"></script>
<script src="/v.js" defer></script>
</body>
</html>
