name: Preview screenshots
on:
  push:
    paths: ['_preview/urls.txt','_preview/reel.mjs']
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: sleep 30 && if [ "${{ startsWith(github.event.head_commit.message, 'reel') }}" = "true" ]; then node _preview/reel.mjs; else node _preview/shot.mjs; fi
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f _preview/out _preview/reel 2>/dev/null; git add -f _preview/out _preview/reel || true
          git commit -m "Preview [skip ci]" || exit 0
          git pull --rebase && git push
