name: Render criativos
on:
  push:
    paths: ['anuncios/marca.html','anuncios/criativos.html','anuncios/render.mjs','.github/workflows/criativos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: sleep 60 && node anuncios/render.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add anuncios/shots anuncios/png
          git commit -m "Criativos renderizados [skip ci]" || exit 0
          git pull --rebase && git push
