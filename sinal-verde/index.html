<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinal Verde · testes de relacionamento</title>
<meta name="description" content="Testes rápidos de sim ou não para refletir sobre o seu relacionamento. Comece pelo: É pra casar?">
<meta property="og:title" content="Sinal Verde · É pra casar?">
<meta property="og:description" content="30 perguntas, 4 minutos e um diagnóstico do seu relacionamento em 6 dimensões.">
<meta name="theme-color" content="#0f3d2e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#1f9d63;--verde-esc:#0f3d2e;--verde-cl:#e3f5ec;--amarelo:#f2b632;--amarelo-cl:#fdf3da;--vermelho:#e0533d;--vermelho-cl:#fce6e2;--creme:#fbf8f2;--tinta:#1b2420;--suave:#5c6a64;--linha:#e6e1d6;--branco:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--creme);color:var(--tinta);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.f{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;line-height:1.1}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
.w{max-width:980px;margin:0 auto;padding:0 20px}
header{padding:18px 0}
header .w{display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:Fraunces;font-weight:800;font-size:21px}
.semaforo{display:inline-flex;flex-direction:column;gap:3px;background:var(--verde-esc);padding:5px 6px;border-radius:9px}
.semaforo i{width:8px;height:8px;border-radius:50%;background:#2c5246;display:block}
.semaforo i:last-child{background:#34d27f;box-shadow:0 0 8px #34d27f}
header nav{margin-left:auto;font-size:14px;color:var(--suave)}
/* home */
.hero{padding:40px 0 30px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--verde)}
.hero h1{font-size:clamp(40px,6vw,66px);font-weight:800;margin:12px 0 16px}
.hero h1 em{font-style:italic;color:var(--verde)}
.hero p{font-size:19px;color:var(--suave);max-width:520px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--verde-esc);color:#fff;border-radius:999px;padding:16px 28px;font-weight:600;font-size:17px;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px);background:#14513c}
.btn.sec{background:var(--branco);color:var(--tinta);border:1.5px solid var(--linha)}
.acoes{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.mini{font-size:14px;color:var(--suave);margin-top:14px}
.cartaz{background:var(--verde-esc);color:#fff;border-radius:28px;padding:30px;position:relative;overflow:hidden;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end}
.cartaz .luzes{position:absolute;top:26px;right:26px;display:flex;flex-direction:column;gap:12px;background:#0a2a20;padding:14px 12px;border-radius:24px}
.cartaz .luzes i{width:34px;height:34px;border-radius:50%;background:#1d4135;display:block}
.cartaz .luzes i:nth-child(1){animation:l1 4.5s infinite}.cartaz .luzes i:nth-child(2){animation:l2 4.5s infinite}.cartaz .luzes i:nth-child(3){animation:l3 4.5s infinite}
@keyframes l1{0%,30%{background:var(--vermelho);box-shadow:0 0 22px var(--vermelho)}34%,100%{background:#1d4135;box-shadow:none}}
@keyframes l2{0%,33%{background:#1d4135;box-shadow:none}36%,62%{background:var(--amarelo);box-shadow:0 0 22px var(--amarelo)}66%,100%{background:#1d4135;box-shadow:none}}
@keyframes l3{0%,65%{background:#1d4135;box-shadow:none}68%,98%{background:#34d27f;box-shadow:0 0 26px #34d27f}100%{background:#1d4135}}
.cartaz q{font-family:Fraunces;font-size:28px;font-weight:700;line-height:1.2;quotes:none;max-width:78%}
.cartaz small{display:block;margin-top:14px;color:#a9cfc0;font-size:14px}
.sec-t{margin:40px 0 18px;display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sec-t h2{font-size:32px}
.testes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:30px}
.teste{background:var(--branco);border:1.5px solid var(--linha);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .15s,border-color .15s}
.teste:hover:not(.breve){transform:translateY(-3px);border-color:var(--verde)}
.teste .ic{font-size:30px}
.teste h3{font-size:22px}
.teste p{font-size:15px;color:var(--suave)}
.teste .meta{margin-top:auto;font-size:13px;font-weight:600;color:var(--verde)}
.teste.breve{opacity:.62;cursor:default}
.teste.breve .meta{color:var(--suave)}
.como{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:10px 0 50px}
.como div{padding:20px;border-top:3px solid var(--verde)}
.como b{display:block;font-family:Fraunces;font-size:20px;margin-bottom:4px}
.como span{color:var(--suave);font-size:15px}
footer{border-top:1px solid var(--linha);padding:24px 0 40px;font-size:13px;color:var(--suave)}
footer .w{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
/* intro do teste */
.intro{max-width:640px;margin:30px auto 60px;text-align:center}
.intro .ic{font-size:54px}
.intro h1{font-size:clamp(34px,5vw,50px);margin:10px 0 14px}
.intro p{color:var(--suave)}
.para{display:inline-flex;background:var(--branco);border:1.5px solid var(--linha);border-radius:999px;padding:4px;margin:22px 0 6px}
.para button{padding:9px 18px;border-radius:999px;font-weight:600;font-size:15px;color:var(--suave)}
.para button[aria-pressed=true]{background:var(--verde-esc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 26px}
.chips span{background:var(--verde-cl);color:var(--verde-esc);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.aviso{font-size:13.5px;color:var(--suave);margin-top:18px}
/* quiz */
.quiz{max-width:620px;margin:16px auto 60px}
.prog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--suave);font-weight:600}
.prog .barra{flex:1;height:8px;background:#ebe6db;border-radius:99px;overflow:hidden}
.prog .barra i{display:block;height:100%;background:var(--verde);border-radius:99px;transition:width .35s}
.voltar{font-size:14px;color:var(--suave);padding:6px 0}
.pergunta{background:var(--branco);border-radius:28px;padding:38px 30px;margin-top:20px;box-shadow:0 20px 50px -30px rgba(15,61,46,.4);min-height:300px;display:flex;flex-direction:column;animation:entra .3s ease}
@keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pergunta .dim{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--verde)}
.pergunta h2{font-size:clamp(25px,4vw,32px);margin:12px 0 30px}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
.resp button{border:2px solid var(--linha);border-radius:18px;padding:20px;font-weight:700;font-size:19px;transition:all .12s;background:var(--creme)}
.resp button:hover{border-color:var(--verde-esc)}
.resp button.sim:active,.resp button.sim.on{background:var(--verde);border-color:var(--verde);color:#fff}
.resp button.nao:active,.resp button.nao.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.dica{text-align:center;font-size:13px;color:var(--suave);margin-top:16px}
/* resultado */
.res{max-width:760px;margin:10px auto 60px}
.selo{border-radius:30px;padding:34px 30px;color:#fff;position:relative;overflow:hidden}
.selo.verde{background:linear-gradient(135deg,#0f3d2e,#1f9d63)}.selo.amarelo{background:linear-gradient(135deg,#7a5200,#e0a21f)}.selo.vermelho{background:linear-gradient(135deg,#6b1d12,#e0533d)}.selo.azul{background:linear-gradient(135deg,#123a52,#2b85b5)}
.selo .luz{position:absolute;right:26px;top:26px;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 40px rgba(255,255,255,.7)}
.selo small{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.selo h1{font-size:clamp(32px,5vw,46px);margin:10px 0 8px;max-width:80%}
.selo p{opacity:.92;max-width:560px}
.selo .nota{font-family:Fraunces;font-size:64px;font-weight:800;line-height:1;margin-top:18px}
.selo .nota span{font-size:22px;opacity:.8}
.card{background:var(--branco);border:1.5px solid var(--linha);border-radius:24px;padding:26px;margin-top:16px}
.card h2{font-size:24px;margin-bottom:16px}
.dims{display:grid;gap:16px}
.dimr{display:grid;grid-template-columns:200px 1fr 46px;gap:14px;align-items:center}
.dimr b{font-size:15.5px}
.dimr .b{height:12px;background:#eeeae1;border-radius:99px;overflow:hidden}
.dimr .b i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.dimr em{font-style:normal;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.dimr small{grid-column:1/-1;color:var(--suave);font-size:14.5px;margin-top:-8px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lista{list-style:none;display:grid;gap:10px}
.lista li{padding-left:28px;position:relative;font-size:15.5px}
.lista li:before{position:absolute;left:0;top:0}
.lista.fortes li:before{content:"✅"}.lista.aten li:before{content:"⚠️"}
.conversa{display:grid;gap:12px}
.conversa div{background:var(--creme);border-radius:16px;padding:16px 18px}
.conversa b{display:block;font-family:Fraunces;font-size:18px;margin-bottom:4px}
.conversa span{color:var(--suave);font-size:15px}
.alerta{background:var(--vermelho-cl);border:1.5px solid #f3c2b8;border-radius:18px;padding:16px 18px;margin-top:16px;font-size:15px}
.fim{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.legal{font-size:13px;color:var(--suave);margin-top:20px;text-align:center}
@media (max-width:820px){
 .hero{grid-template-columns:1fr;gap:28px;padding-top:20px}
 .cartaz{min-height:260px}
 .testes,.como{grid-template-columns:1fr}
 .duas{grid-template-columns:1fr}
 .dimr{grid-template-columns:1fr 46px}.dimr .b{grid-column:1/-1;grid-row:2}
 .pergunta{padding:28px 22px}
 .selo .luz{width:44px;height:44px}
 header nav{display:none}
}
</style>
</head>
<body>
<header><div class="w"><a class="logo" href="#/"><span class="semaforo"><i></i><i></i><i></i></span>Sinal Verde</a><nav>Testes rápidos para pensar o seu relacionamento</nav></div></header>
<main id="app"></main>
<footer><div class="w"><span>© 2026 Sinal Verde · Entretenimento e reflexão: os testes medem a sua percepção, não substituem uma boa conversa nem acompanhamento profissional.</span><span>Suas respostas ficam só no seu aparelho.</span></div></footer>
<script>
/* ===== Catálogo de testes =====
   Cada teste: id, titulo, icone, resumo, alvo (pronomes), dims e perguntas.
   Pergunta: [dim, texto, inv]. inv = true quando "Sim" é o sinal ruim. */
const TESTES = [
 { id:"pra-casar", titulo:"É pra casar?", icone:"💍", resumo:"30 perguntas de sim ou não sobre o dia a dia de vocês, em 6 dimensões que pesam num casamento.", tempo:"4 min", genero:true,
   dims:{
    afin:["Afinidade","Gostos, humor e prazer de estar junto."],
    conf:["Confiança e lealdade","Transparência, coerência e segurança na relação."],
    com:["Comunicação e conflitos","Como vocês conversam, brigam e fazem as pazes."],
    proj:["Projetos de vida","Filhos, dinheiro, onde morar e futuro."],
    parc:["Parceria no dia a dia","Apoio, cuidado e divisão de responsabilidades."],
    resp:["Respeito e admiração","Como {ela} te trata e como você {a} enxerga."]},
   peso:{conf:1.3,resp:1.3},
   perguntas:[
    ["afin","Vocês riem juntos com frequência?"],
    ["conf","{Ela} cumpre o que promete?"],
    ["com","Vocês conseguem discutir sem ofensas nem gritos?"],
    ["proj","Vocês já conversaram sobre ter (ou não ter) filhos e pensam parecido?"],
    ["parc","{Ela} te apoia em momentos difíceis, como problemas no trabalho, na saúde ou na família?"],
    ["resp","{Ela} te trata bem na frente de amigos e da família?"],
    ["afin","Vocês gostam de fazer muitas coisas em comum?"],
    ["conf","Você já pegou {ela} em mentiras, mesmo pequenas, mais de uma vez?",true],
    ["com","Depois de uma briga, vocês conversam sobre o que aconteceu?"],
    ["proj","Vocês têm uma visão parecida sobre dinheiro: gastar, guardar e dividir contas?"],
    ["parc","{Ela} comemora de verdade as suas conquistas?"],
    ["resp","{Ela} costuma te diminuir ou fazer piadas que te magoam?",true],
    ["afin","Você sente falta {dela} quando passam alguns dias sem se ver?"],
    ["conf","{Ela} esconde o celular ou fica desconfortável quando você chega perto?",true],
    ["com","{Ela} fica dias sem falar com você quando está chateada?",true],
    ["proj","{Ela} fala de planos para o futuro incluindo você?"],
    ["parc","No dia a dia, as responsabilidades ficam quase todas em cima de um só?",true],
    ["resp","{Ela} respeita suas amizades e o seu espaço?"],
    ["afin","Às vezes vocês ficam sem assunto quando estão só os dois?",true],
    ["conf","{Ela} fala abertamente com quem conversa e por onde anda, sem você precisar perguntar?"],
    ["com","{Ela} pede desculpas quando erra?"],
    ["proj","Vocês concordam sobre onde e como gostariam de morar?"],
    ["parc","{Ela} se preocupa com o seu bem-estar, mesmo nas coisas pequenas?"],
    ["resp","Você admira quem {ela} é, e não só o que {ela} faz por você?"],
    ["afin","{Ela} se interessa pelas coisas de que você gosta, mesmo que não sejam a praia {dela}?"],
    ["conf","Você se sente tranquilo quando {ela} sai sem você?"],
    ["com","Você evita certos assuntos para não ter briga?",true],
    ["proj","Os objetivos de carreira de um atrapalham os do outro?",true],
    ["parc","Você pode contar com {ela} para resolver um imprevisto?"],
    ["resp","{Ela} te apresenta com orgulho para as pessoas importantes da vida {dela}?"]],
   textos:{
    afin:{alto:"Vocês têm química no dia a dia: gostam de estar juntos e se divertem.",medio:"A afinidade existe, mas vale criar mais momentos só de vocês.",baixo:"Pouco em comum e pouca diversão juntos. Casamento sem afinidade pesa com o tempo.",conversa:["Um programa novo por mês","Escolham juntos algo que nenhum dos dois fez ainda e coloquem na agenda."]},
    conf:{alto:"Você se sente seguro na relação: o que {ela} fala bate com o que {ela} faz.",medio:"Há confiança, mas com pontos de dúvida. Melhor esclarecer do que alimentar suspeita.",baixo:"A confiança está abalada. Antes de pensar em casamento, isso precisa ser conversado com franqueza.",conversa:["O que nos faz sentir seguros","Falem sobre o que cada um precisa para se sentir tranquilo: transparência, celular, saídas, ex. Sem acusação, com combinados."]},
    com:{alto:"Vocês sabem conversar e resolver conflitos sem se machucar.",medio:"As conversas funcionam, mas alguns assuntos ficam varridos para debaixo do tapete.",baixo:"Brigas mal resolvidas e silêncio são o maior risco para um casamento.",conversa:["Como a gente briga","Combinem regras para discussões: sem ofensa, sem gelo de dias, e voltar ao assunto quando os dois estiverem calmos."]},
    proj:{alto:"Vocês olham para o mesmo futuro: filhos, dinheiro e casa estão alinhados.",medio:"Os planos se parecem, mas ainda há temas importantes sem acordo.",baixo:"Os projetos de vida estão desalinhados. Amor não resolve, sozinho, visões opostas de futuro.",conversa:["Nossa vida daqui a 5 anos","Cada um escreve como imagina a vida em 5 anos (filhos, casa, dinheiro, carreira) e depois comparem."]},
    parc:{alto:"Vocês são um time: um apoia o outro de verdade.",medio:"Existe parceria, mas a divisão de cuidados e tarefas pode ficar mais justa.",baixo:"Pouca parceria no dia a dia. No casamento, a rotina pesa mais que as datas especiais.",conversa:["Quem faz o quê","Listem as tarefas e responsabilidades da rotina e vejam juntos se a divisão está justa para os dois."]},
    resp:{alto:"Há respeito e admiração mútua, a base de tudo.",medio:"O respeito existe, mas alguns comportamentos merecem atenção.",baixo:"Falta respeito. Isso não é detalhe: é o ponto mais importante a resolver antes de qualquer decisão.",conversa:["O que me machuca","Contem um ao outro, com calma, atitudes ou brincadeiras que magoam, e combinem como evitar."]}}
 },
 { id:"bom-parceiro", titulo:"Eu sou um bom parceiro?", icone:"🪞", resumo:"O teste ao contrário: olhe para as suas atitudes na relação.", breve:true },
 { id:"vale-a-pena", titulo:"Meu emprego vale a pena?", icone:"💼", resumo:"Salário, crescimento, ambiente e propósito na balança.", breve:true },
 { id:"empreender", titulo:"Estou pronto para empreender?", icone:"🚀", resumo:"Perfil, reserva, tempo e tolerância a risco.", breve:true },
 { id:"amizade", titulo:"Essa amizade é verdadeira?", icone:"🤝", resumo:"Reciprocidade, lealdade e presença nos momentos difíceis.", breve:true },
 { id:"dinheiro", titulo:"Como anda sua relação com o dinheiro?", icone:"💰", resumo:"Hábitos, controle e planos financeiros.", breve:true }
];

const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let alvo='ela'; try{alvo=localStorage.getItem('sv_alvo')||'ela'}catch(e){}
const P=()=>alvo==='ela'?{ela:'ela',Ela:'Ela',dela:'dela',a:'a',namorada:'namorada',fiel:'fiel'}:{ela:'ele',Ela:'Ele',dela:'dele',a:'o',namorada:'namorado',fiel:'fiel'};
const txt=s=>String(s).replace(/\{(\w+)\}/g,(m,k)=>P()[k]??m);

function rota(){const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='t'&&h[1]){const T=TESTES.find(t=>t.id===h[1]&&!t.breve);if(T)return h[2]==='q'?quiz(T):h[2]==='r'?resultado(T):intro(T)}
  home()}
addEventListener('hashchange',()=>{rota();scrollTo(0,0)});

function home(){
  document.title='Sinal Verde · testes de relacionamento';
  app.innerHTML=`<div class="w"><section class="hero"><div>
    <div class="eyebrow">Testes rápidos · sim ou não</div>
    <h1>Seu relacionamento está com <em>sinal verde?</em></h1>
    <p>Responda perguntas simples sobre o dia a dia e receba um diagnóstico em várias dimensões, com pontos fortes, pontos de atenção e conversas para ter a dois.</p>
    <div class="acoes"><a class="btn" href="#/t/pra-casar">💍 Fazer o teste "É pra casar?"</a><a class="btn sec" href="#testes">Ver todos os testes</a></div>
    <p class="mini">Grátis · 4 minutos · suas respostas não saem do seu celular</p></div>
    <div class="cartaz"><div class="luzes"><i></i><i></i><i></i></div><q>“A gente se ama. Mas será que dá casamento?”</q><small>30 perguntas · 6 dimensões · diagnóstico na hora</small></div></section>
    <div class="sec-t" id="testes"><h2>Escolha um teste</h2><span class="mini" style="margin:0">Novos testes chegando toda semana</span></div>
    <div class="testes">${TESTES.map(t=>`<${t.breve?'div':'a href="#/t/'+t.id+'"'} class="teste ${t.breve?'breve':''}" style="text-decoration:none"><span class="ic">${t.icone}</span><h3>${esc(t.titulo)}</h3><p>${esc(t.resumo)}</p><span class="meta">${t.breve?'Em breve':`${t.perguntas.length} perguntas · ${t.tempo} →`}</span></${t.breve?'div':'a'}>`).join('')}</div>
    <div class="como"><div><b>1. Responda com sinceridade</b><span>Sim ou não. Pense no que acontece de verdade, não no que você gostaria.</span></div><div><b>2. Veja o diagnóstico</b><span>Uma nota geral, um gráfico por dimensão e o que está forte ou merece atenção.</span></div><div><b>3. Converse</b><span>Cada resultado traz conversas sugeridas para ter a dois. É aí que a mágica acontece.</span></div></div></div>`;
}

function intro(T){
  document.title=`${T.titulo} · Sinal Verde`;
  app.innerHTML=`<div class="w"><div class="intro"><div class="ic">${T.icone}</div><h1>${esc(T.genero?txt(`{Ela} é pra casar?`).replace(/^Ela/,'Minha namorada').replace(/^Ele/,'Meu namorado'):T.titulo)}</h1>
    <p>${esc(T.resumo)} Não existe resposta certa: responda pensando no que acontece de verdade.</p>
    ${T.genero?`<div><div class="para" role="group" aria-label="Quem você vai avaliar"><button data-alvo="ela" aria-pressed="${alvo==='ela'}">Minha namorada</button><button data-alvo="ele" aria-pressed="${alvo==='ele'}">Meu namorado</button></div></div>`:''}
    <div class="chips">${Object.values(T.dims).map(d=>`<span>${esc(txt(d[0]))}</span>`).join('')}</div>
    <a class="btn" href="#/t/${T.id}/q">Começar · ${T.perguntas.length} perguntas</a>
    <p class="aviso">Entretenimento e reflexão. O teste mede a sua percepção da relação, não prova nada sobre ninguém.</p></div></div>`;
  app.querySelectorAll('[data-alvo]').forEach(b=>b.onclick=()=>{alvo=b.dataset.alvo;try{localStorage.setItem('sv_alvo',alvo)}catch(e){}intro(T)});
}

let RESP={};
function quiz(T){
  if(!RESP[T.id]||RESP[T.id].length!==T.perguntas.length)RESP[T.id]=Array(T.perguntas.length).fill(null);
  const R=RESP[T.id];let i=R.findIndex(v=>v===null);if(i<0)i=0;
  const draw=()=>{const [d,q]=T.perguntas[i],feitas=R.filter(v=>v!==null).length;
    app.innerHTML=`<div class="w"><div class="quiz">
      <div class="prog"><button class="voltar" id="vol">${i?'← Voltar':'← Sair'}</button><div class="barra"><i style="width:${feitas/T.perguntas.length*100}%"></i></div><span>${i+1}/${T.perguntas.length}</span></div>
      <div class="pergunta"><span class="dim">${esc(txt(T.dims[d][0]))}</span><h2>${esc(txt(q))}</h2>
      <div class="resp"><button class="sim ${R[i]===1?'on':''}" data-v="1">Sim</button><button class="nao ${R[i]===0?'on':''}" data-v="0">Não</button></div></div>
      <p class="dica">Atalho: tecla S para sim e N para não</p></div></div>`;
    $('#vol').onclick=()=>{if(i===0){location.hash=`#/t/${T.id}`;return}i--;draw()};
    app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>responder(+b.dataset.v));};
  const responder=v=>{R[i]=v;const b=app.querySelector(`[data-v="${v}"]`);b&&b.classList.add('on');
    setTimeout(()=>{if(i<T.perguntas.length-1){i++;draw()}else{location.hash=`#/t/${T.id}/r`}},170)};
  onkeydown=e=>{if(!location.hash.endsWith('/q'))return;if(/^[sS]$/.test(e.key))responder(1);if(/^[nN]$/.test(e.key))responder(0)};
  draw();
}

function calcular(T){const R=RESP[T.id],S={};Object.keys(T.dims).forEach(k=>S[k]={p:0,n:0});
  T.perguntas.forEach(([d,,inv],i)=>{S[d].n++;if(R[i]===null)return;S[d].p+=(inv?1-R[i]:R[i])});
  const pct={};Object.keys(S).forEach(k=>pct[k]=Math.round(S[k].p/S[k].n*100));
  let tp=0,tw=0;Object.keys(pct).forEach(k=>{const w=(T.peso||{})[k]||1;tp+=pct[k]*w;tw+=w});
  return {pct,geral:Math.round(tp/tw)}}

function resultado(T){
  if(!RESP[T.id]||RESP[T.id].some(v=>v===null)){location.hash=`#/t/${T.id}`;return}
  const {pct,geral}=calcular(T),ks=Object.keys(pct),baixo=ks.filter(k=>pct[k]<50),critico=['conf','resp'].some(k=>pct[k]<50);
  let cor,titulo,frase;
  if(geral>=80&&!baixo.length){cor='verde';titulo=txt('Sinal verde: {ela} é pra casar 💍');frase='A relação mostra base sólida em todas as dimensões. Agora é cuidar para continuar assim.'}
  else if(geral>=65&&!critico){cor='azul';titulo='Promissor, mas vale conversar';frase='Tem muita coisa boa aqui, e alguns pontos que precisam de atenção antes de um passo tão grande.'}
  else if(geral>=45){cor='amarelo';titulo='Sinal amarelo: vá com calma';frase='Há pontos importantes a resolver. Não é um "não", mas é hora de conversar sério antes de decidir.'}
  else{cor='vermelho';titulo='Sinal vermelho: pare e reflita';frase='Os sinais indicam problemas de base. Antes de pensar em casamento, olhe com carinho para o que está faltando.'}
  if(critico&&cor!=='vermelho'){cor='amarelo';titulo='Sinal amarelo: atenção à confiança e ao respeito';frase='Mesmo com pontos positivos, confiança e respeito estão baixos, e esses dois sustentam um casamento.'}
  const corDe=v=>v>=80?'var(--verde)':v>=50?'var(--amarelo)':'var(--vermelho)',nv=v=>v>=80?'alto':v>=50?'medio':'baixo';
  const ord=[...ks].sort((a,b)=>pct[b]-pct[a]),fortes=ord.filter(k=>pct[k]>=70).slice(0,3),aten=[...ord].reverse().filter(k=>pct[k]<80).slice(0,3);
  const R=RESP[T.id],ofensa=T.id==='pra-casar'&&R[11]===1;
  const nome=T.genero?txt('{namorada}'):'';
  const share=`Fiz o teste "${T.titulo}" no Sinal Verde e deu ${geral}/100: ${titulo.replace(/[💍]/g,'').trim()}. Faz o seu: ${location.origin+location.pathname}#/t/${T.id}`;
  app.innerHTML=`<div class="w"><div class="res">
    <div class="selo ${cor}"><div class="luz"></div><small>Resultado · ${esc(T.titulo)}</small><h1>${esc(titulo)}</h1><p>${esc(frase)}</p><div class="nota">${geral}<span>/100</span></div></div>
    <div class="card"><h2>As 6 dimensões</h2><div class="dims">${ks.map(k=>`<div class="dimr"><b>${esc(txt(T.dims[k][0]))}</b><div class="b"><i data-w="${pct[k]}" style="background:${corDe(pct[k])}"></i></div><em>${pct[k]}%</em><small>${esc(txt(T.textos[k][nv(pct[k])]))}</small></div>`).join('')}</div></div>
    ${ofensa?`<div class="alerta"><b>Um ponto que merece atenção especial:</b> você respondeu que ${txt('{ela}')} costuma te diminuir ou fazer piadas que magoam. Em uma relação saudável, isso não deveria ser rotina. Se acontece com frequência, vale conversar com alguém de confiança ou com um profissional.</div>`:''}
    <div class="duas"><div class="card"><h2>Pontos fortes</h2>${fortes.length?`<ul class="lista fortes">${fortes.map(k=>`<li><b>${esc(txt(T.dims[k][0]))}</b>: ${esc(txt(T.textos[k].alto).split(':')[0].replace(/\.$/,''))}.</li>`).join('')}</ul>`:'<p style="color:var(--suave)">Nenhuma dimensão acima de 70% por enquanto.</p>'}</div>
      <div class="card"><h2>Pontos de atenção</h2>${aten.length?`<ul class="lista aten">${aten.map(k=>`<li><b>${esc(txt(T.dims[k][0]))}</b> (${pct[k]}%)</li>`).join('')}</ul>`:'<p style="color:var(--suave)">Tudo acima de 80%. Bonito de ver!</p>'}</div></div>
    <div class="card"><h2>3 conversas para ter a dois</h2><div class="conversa">${(aten.length?aten:ord.slice(-3)).slice(0,3).map(k=>`<div><b>${esc(T.textos[k].conversa[0])}</b><span>${esc(txt(T.textos[k].conversa[1]))}</span></div>`).join('')}</div></div>
    <div class="fim"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(share)}">Compartilhar no WhatsApp</a><button class="btn sec" id="refazer">Refazer o teste</button><a class="btn sec" href="#/">Outros testes</a></div>
    <p class="legal">Resultado para entretenimento e reflexão, com base apenas nas suas respostas. Não é avaliação psicológica e não prova nada sobre ${esc(nome?'a pessoa':'ninguém')}. A melhor resposta sempre vem de uma boa conversa.</p></div></div>`;
  requestAnimationFrame(()=>setTimeout(()=>app.querySelectorAll('[data-w]').forEach(i=>i.style.width=i.dataset.w+'%'),60));
  $('#refazer').onclick=()=>{RESP[T.id]=null;location.hash=`#/t/${T.id}/q`};
}
rota();
</script>
</body>
</html>
