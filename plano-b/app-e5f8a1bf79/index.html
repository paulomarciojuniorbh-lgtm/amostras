<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plano B · Kit Offline de Emergência</title>
<meta name="theme-color" content="#121512">
<style>
:root{--bg:#121512;--bg2:#1a1e1a;--bg3:#242a24;--ama:#f4c430;--ama2:#ffd95a;--txt:#ecebe4;--sua:#a7ab9f;--linha:#323a32;--verm:#e5533d;--verde:#7fb069;--azul:#6aa9d8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;background:var(--bg);color:var(--txt);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"Cascadia Mono","Consolas",Menlo,monospace}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--ama)}
.app{display:grid;grid-template-columns:250px 1fr;height:100vh}
aside{background:var(--bg2);border-right:1px solid var(--linha);display:flex;flex-direction:column;overflow:auto}
.logo{padding:20px 18px 14px;display:flex;gap:10px;align-items:center}
.logo .b{width:40px;height:40px;border-radius:10px;background:var(--ama);color:#121512;display:grid;place-items:center;font-weight:900;font-size:22px}
.logo strong{display:block;font-size:19px;letter-spacing:.02em}
.logo small{color:var(--sua);font-size:12.5px}
.status{margin:0 14px 12px;border:1px solid var(--linha);border-radius:10px;padding:8px 10px;font-size:12.5px;display:flex;gap:8px;align-items:center;color:var(--sua)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde);flex:none}
.status.on i{background:var(--azul);box-shadow:0 0 8px var(--azul)}
nav{display:flex;flex-direction:column;padding:4px 8px 16px;gap:2px}
nav button{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:9px;color:var(--sua);font-size:15.5px}
nav button:hover{background:var(--bg3);color:var(--txt)}
nav button.on{background:var(--ama);color:#121512;font-weight:650}
nav .ic{width:22px;text-align:center}
main{overflow:auto;position:relative}
.pg{max-width:880px;margin:0 auto;padding:30px 26px 80px}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ama);font-weight:700}
h1{font-size:clamp(28px,4vw,38px);line-height:1.1;margin:8px 0 10px}
h2{font-size:22px;margin:28px 0 10px}
h3{font-size:17.5px;margin-bottom:6px}
p.lead{color:var(--sua);font-size:18px;max-width:640px}
.card{background:var(--bg2);border:1px solid var(--linha);border-radius:14px;padding:18px 20px;margin-top:14px}
.card p,.card li{color:#d6d6cd}
.card ol,.card ul{padding-left:20px;display:grid;gap:6px}
.alerta{border-color:rgba(229,83,61,.55);background:linear-gradient(90deg,rgba(229,83,61,.12),transparent)}
.alerta h3{color:#ff8a76}
.dica{border-color:rgba(244,196,48,.5);background:linear-gradient(90deg,rgba(244,196,48,.1),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:14px}
.tile{background:var(--bg2);border:1px solid var(--linha);border-radius:14px;padding:16px;text-align:left;transition:border-color .12s,transform .12s}
.tile:hover{border-color:var(--ama);transform:translateY(-2px)}
.tile .ic{font-size:26px}
.tile b{display:block;margin:6px 0 2px;font-size:16.5px}
.tile span{color:var(--sua);font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linha)}
th{color:var(--sua);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.num{font-variant-numeric:tabular-nums;text-align:right}
label.f{display:block;font-size:13.5px;color:var(--sua);margin:10px 0 4px}
input[type=number],input[type=text],input[type=tel],select,textarea{width:100%;background:var(--bg);border:1px solid var(--linha);border-radius:9px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ama);border-color:transparent}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ama);color:#121512;font-weight:700;border-radius:10px;padding:11px 16px}
.btn:hover{background:var(--ama2)}
.btn.sec{background:var(--bg3);color:var(--txt);font-weight:600}
.check{list-style:none;padding:0!important}
.check li{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px dashed var(--linha)}
.check input{width:20px;height:20px;accent-color:var(--ama);margin-top:2px;flex:none}
.check li.ok span{color:var(--sua);text-decoration:line-through}
.prog{height:8px;background:var(--bg3);border-radius:9px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--ama);transition:width .3s}
.big{font-size:34px;font-weight:800;color:var(--ama);font-variant-numeric:tabular-nums;line-height:1.1}
/* mapa */
.mapa{display:grid;grid-template-columns:340px 1fr;height:100vh}
.mpainel{padding:20px 18px;overflow:auto;border-right:1px solid var(--linha);background:var(--bg)}
#cv{width:100%;height:100%;display:block;background:#0d110e;touch-action:none;cursor:grab}
.cvbox{position:relative;min-height:300px}
.zoom{position:absolute;right:12px;top:12px;display:grid;gap:6px}
.zoom button{width:38px;height:38px;border-radius:9px;background:var(--bg2);border:1px solid var(--linha);font-size:20px;font-weight:700}
.escala{position:absolute;left:12px;bottom:12px;background:rgba(18,21,18,.85);padding:6px 10px;border-radius:8px;font-size:12.5px;color:var(--sua)}
.ac{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:10;background:var(--bg2);border:1px solid var(--linha);border-radius:9px;margin-top:4px;max-height:240px;overflow:auto;display:none}
.sug button{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--linha);font-size:15px}
.sug button:hover,.sug button.sel{background:var(--bg3)}
.sug small{color:var(--sua)}
.res{margin-top:16px;display:none}
.rosa{width:150px;height:150px;margin:6px auto 4px;display:block}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kv div{background:var(--bg2);border:1px solid var(--linha);border-radius:10px;padding:10px}
.kv small{color:var(--sua);font-size:12.5px;display:block}
.kv b{font-size:19px;font-variant-numeric:tabular-nums}
.via{font-size:14.5px;color:#d6d6cd;margin-top:10px}
.via li{margin-bottom:3px}
.tabs{display:flex;gap:6px;margin:6px 0 4px}
.tabs button{padding:7px 12px;border-radius:8px;background:var(--bg3);font-size:14px;color:var(--sua)}
.tabs button.on{background:var(--ama);color:#121512;font-weight:700}
.legenda{font-size:12.5px;color:var(--sua);margin-top:14px;display:grid;gap:4px}
.legenda span{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px}
.menu-m{display:none}
#imp{display:none}
@media (max-width:860px){
 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
 aside{position:sticky;top:0;z-index:20;border-right:0;border-bottom:1px solid var(--linha);overflow:visible}
 .logo{padding:12px 14px}
 .status{display:none}
 .menu-m{display:block;margin-left:auto;background:var(--bg3);border-radius:9px;padding:8px 12px}
 nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg2);border-bottom:1px solid var(--linha);max-height:70vh;overflow:auto}
 nav.aberto{display:flex}
 main{overflow:visible}
 .pg{padding:22px 16px 60px}
 .mapa{grid-template-columns:1fr;height:auto}
 .mpainel{border-right:0}
 .cvbox{height:70vh}
}
@media print{
 body{background:#fff;color:#000;font-size:12pt}
 .app{display:none}
 #imp{display:block}
 #imp .card{background:#fff;border:1px solid #999;break-inside:avoid}
 #imp .card p,#imp .card li{color:#000}
 #imp h1{font-size:22pt}#imp h2{page-break-before:always;font-size:16pt}
 #imp .eyebrow{color:#000}
}
</style>
</head>

  <div class="status" id="st"><i></i><span>Funcionando sem internet</span></div>
  <nav id="nav"></nav>
 </aside>
 <main id="main"></main>
</div>

const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem("pb_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("pb_"+k,JSON.stringify(v))}catch(e){}}};
const n1=x=>x.toLocaleString("pt-BR",{maximumFractionDigits:1}),n0=x=>Math.round(x).toLocaleString("pt-BR");

/* ================= CONTEÚDO ================= */
const G={
agua:{ic:"💧",t:"Água",sub:"Purificar, estocar e economizar",html:`
<p class="lead">Sem água tratada, o risco maior não é a sede: é a diarreia. Água que parece limpa pode ter micróbios. Na dúvida, trate.</p>
<div class="card dica"><h3>Regra de ouro</h3><p>Primeiro deixe a água <b>limpa</b> (decantar e coar), depois deixe a água <b>segura</b> (ferver, hipoclorito ou sol). Coar e filtro caseiro <b>não</b> matam micróbios.</p></div>
<h2>1. Ferver (o método mais seguro)</h2>
<div class="card"><ol><li>Se a água estiver turva, deixe descansar e coe num pano limpo antes.</li><li>Leve ao fogo até <b>ferver forte</b> (bolhas grandes subindo sem parar).</li><li>Mantenha fervendo por <b>1 minuto</b>. Em lugares acima de 2.000 m de altitude, <b>3 minutos</b>.</li><li>Deixe esfriar tampada e guarde em recipiente limpo e com tampa.</li></ol><p style="margin-top:8px;color:var(--sua);font-size:14px">Fonte: CDC (Centros de Controle e Prevenção de Doenças, EUA).</p></div>
<h2>2. Hipoclorito de sódio 2,5%</h2>
<div class="card"><p>É o produto distribuído de graça nos postos de saúde.</p>
<table><tr><th>Água</th><th class="num">Hipoclorito 2,5%</th></tr><tr><td>1 litro</td><td class="num">2 gotas</td></tr><tr><td>10 litros</td><td class="num">20 gotas (1 ml)</td></tr><tr><td>20 litros</td><td class="num">40 gotas (2 ml)</td></tr><tr><td>200 litros</td><td class="num">4 colheres de chá (20 ml)</td></tr><tr><td>1.000 litros</td><td class="num">100 ml</td></tr></table>
<ol style="margin-top:10px"><li>Misture e espere <b>30 minutos</b> antes de beber.</li><li>Consuma em até <b>24 horas</b>.</li></ol></div>
<div class="card alerta"><h3>⚠️ Água sanitária</h3><p><b>Nunca</b> use água sanitária com perfume ou alvejante para tratar água de beber. Só serve a que diz no rótulo que é própria para tratar água, ou o hipoclorito 2,5%. Use luvas e não misture com outros produtos de limpeza.</p><p style="margin-top:6px;color:var(--sua);font-size:14px">Fonte: Centro de Vigilância Epidemiológica, Secretaria da Saúde de SP.</p></div>
<h2>3. Sol (SODIS), quando não há fogo nem cloro</h2>
<div class="card"><ol><li>Use garrafa PET <b>transparente</b>, sem rótulo e de até 2 litros.</li><li>A água precisa estar clara: se der para ler letras grandes de jornal através da garrafa, está boa.</li><li>Deite a garrafa em lugar de sol forte, de preferência sobre telha ou metal.</li><li>Deixe <b>6 horas</b> com sol, ou <b>2 dias</b> se o céu estiver nublado. Com chuva o tempo todo, não funciona.</li></ol><p style="margin-top:8px">O sol não remove produtos químicos nem metais. Fonte: método SODIS, recomendado pela OMS.</p></div>
<h2>4. Filtro caseiro (só para clarear)</h2>
<div class="card"><p>Garrafa PET cortada, de cabeça para baixo, em camadas de baixo para cima: pano, carvão de lenha triturado, areia fina, areia grossa, cascalho. Isso tira a sujeira e a cor, mas <b>depois ainda precisa ferver, clorar ou usar o sol</b>.</p></div>
<h2>Quanto estocar</h2>
<div class="card"><p><b>4 litros por pessoa por dia</b> (cerca de 2 para beber e o resto para cozinhar e higiene). Mínimo de 3 dias, ideal 2 semanas. Some mais para crianças pequenas, gestantes, idosos e pets. Use a calculadora na seção Alimentos.</p><p style="margin-top:6px">Guarde em galões limpos e fechados, longe do sol e de produtos químicos. Troque a água a cada 6 meses.</p></div>
<div class="card dica"><h3>Água escondida na sua casa</h3><ul><li>A caixa d'água (feche o registro da rua se houver risco de contaminação).</li><li>O reservatório do aquecedor e o encanamento: abra a torneira mais baixa da casa.</li><li>Gelo do freezer.</li><li>A água da descarga (caixa acoplada) serve para higiene, não para beber.</li></ul></div>`},
alim:{ic:"🥫",t:"Alimentos",sub:"O que estocar + calculadora",calc:true,html:`
<p class="lead">Estoque o que a sua família já come, que dure meses fora da geladeira e que dê para comer sem cozinhar ou com pouco gás.</p>
<h2>O que estocar</h2>
<div class="grid">
<div class="card" style="margin:0"><h3>🍚 Base</h3><p>Arroz, macarrão, feijão, farinha, aveia, fubá, açúcar, sal.</p></div>
<div class="card" style="margin:0"><h3>🥫 Pronto pra comer</h3><p>Atum, sardinha, salsicha em lata, milho, ervilha, feijão em lata, frutas em calda.</p></div>
<div class="card" style="margin:0"><h3>⚡ Energia rápida</h3><p>Pasta de amendoim, castanhas, barras de cereal, biscoito, chocolate, leite em pó.</p></div>
<div class="card" style="margin:0"><h3>🧂 Extras</h3><p>Óleo, café, chá, temperos, multivitamínico, comida do pet, alimentos especiais (bebês, dietas).</p></div></div>
<div class="card dica"><h3>Regras simples</h3><ul><li><b>Primeiro que entra, primeiro que sai:</b> use o mais antigo e reponha atrás.</li><li>Tenha um <b>abridor de lata manual</b>.</li><li>Fogareiro + gás reserva, ou fogão a lenha improvisado em área aberta.</li><li>Sem energia: coma primeiro o que está na geladeira, depois o freezer, por último o estoque. Freezer cheio e fechado mantém o frio por cerca de 48 horas.</li></ul></div>
<div class="card alerta"><h3>⚠️ Jogue fora</h3><p>Latas estufadas, enferrujadas, amassadas na emenda ou vazando, e alimentos que tiveram contato com água de enchente.</p></div>`},
mapa:{ic:"🗺️",t:"Mapa e direção",sub:"Origem, destino e rumo sem internet"},
orient:{ic:"🧭",t:"Orientação sem GPS",sub:"Sol, sombra e estrelas",html:`
<p class="lead">O GPS do celular funciona sem internet, mas a bateria acaba. Aprenda a achar o norte com o que está no céu.</p>
<h2>Pelo Sol (o jeito rápido)</h2>
<div class="card"><p>O Sol <b>nasce do lado leste</b> e <b>se põe do lado oeste</b>. De manhã, aponte o braço direito para onde o Sol nasceu: à sua frente está o <b>norte</b>, atrás o sul, à esquerda o oeste.</p><p style="margin-top:6px">No Brasil, na maior parte do ano, ao meio-dia o Sol fica um pouco para o lado norte do céu.</p></div>
<h2>Método da sombra (mais preciso)</h2>
<div class="card"><ol><li>Finque uma vareta reta no chão, em lugar plano e com sol.</li><li>Marque com uma pedra a ponta da sombra.</li><li>Espere 15 a 20 minutos e marque a nova ponta da sombra.</li><li>Ligue as duas marcas: a <b>primeira é o oeste</b> e a <b>segunda é o leste</b>.</li><li>Fique com a primeira marca à esquerda e a segunda à direita: você está olhando para o <b>norte</b>.</li></ol></div>
<h2>À noite: Cruzeiro do Sul</h2>
<div class="card"><ol><li>Ache a cruz de 4 estrelas brilhantes (a "pipa").</li><li>Prolongue o braço maior da cruz, do topo para o pé, cerca de <b>4 vezes e meia</b> o tamanho dela.</li><li>Desça desse ponto imaginário até o horizonte: ali é o <b>sul</b>.</li></ol></div>
<h2>Mantendo o rumo</h2>
<div class="card"><ul><li>Escolha um ponto de referência longe na direção certa (árvore, morro, torre) e caminhe até ele. Depois escolha o próximo.</li><li>Rios correm para baixo e quase sempre levam a estradas e cidades.</li><li>Rodovias e linhas de energia são os melhores "corrimãos": siga por elas.</li><li>Anote horários e direções num papel: ajuda a voltar.</li></ul></div>`},
energia:{ic:"🔦",t:"Energia e luz",sub:"Apagão, bateria e segurança",html:`
<p class="lead">Num apagão longo, o que acaba primeiro é a bateria do celular. Economize desde a primeira hora.</p>
<div class="card"><h3>Primeiras horas</h3><ul><li>Coloque o celular em <b>modo economia</b>, baixe o brilho e desligue o que não usa (Wi-Fi, Bluetooth). Em lugar sem sinal, o <b>modo avião</b> poupa muita bateria.</li><li>Desligue da tomada os aparelhos sensíveis (TV, computador, geladeira) para evitar estrago na volta da energia.</li><li>Deixe uma lâmpada ligada para saber quando a energia voltar.</li><li>Evite abrir geladeira e freezer.</li></ul></div>
<div class="card"><h3>O que ter em casa</h3><ul><li>Lanternas (uma por pessoa) e pilhas reserva. Lanterna de cabeça deixa as mãos livres.</li><li>Power bank carregado e carregador de carro.</li><li>Rádio a pilha ou a manivela, para notícias da Defesa Civil.</li><li>Painel solar pequeno com saída USB, se possível.</li></ul></div>
<div class="card alerta"><h3>⚠️ Perigos reais</h3><ul><li><b>Nunca</b> use gerador, churrasqueira ou fogareiro dentro de casa ou garagem fechada: o monóxido de carbono mata sem cheiro.</li><li>Velas só em suporte firme, longe de cortinas e de crianças. Prefira lanterna.</li><li>Fios caídos na rua: fique longe e avise a concessionária ou os bombeiros (193).</li></ul></div>`},
socorro:{ic:"🩹",t:"Primeiros socorros",sub:"O básico que salva",html:`
<p class="lead">Isto não substitui um curso de primeiros socorros. Se puder, faça um: Cruz Vermelha e Corpo de Bombeiros oferecem cursos.</p>
<div class="card alerta"><h3>Telefones de emergência</h3><table><tr><td>SAMU</td><td class="num mono">192</td></tr><tr><td>Bombeiros</td><td class="num mono">193</td></tr><tr><td>Polícia Militar</td><td class="num mono">190</td></tr><tr><td>Defesa Civil</td><td class="num mono">199</td></tr></table><p style="margin-top:6px">O 112 e os números acima costumam funcionar mesmo sem crédito.</p></div>
<div class="card"><h3>Sangramento</h3><ol><li>Aperte firme o ferimento com um pano limpo e não solte.</li><li>Se o pano encharcar, coloque outro por cima, sem tirar o primeiro.</li><li>Mantenha a pessoa deitada e aquecida e procure ajuda.</li></ol></div>
<div class="card"><h3>Queimadura</h3><ol><li>Água corrente em temperatura ambiente por 20 minutos.</li><li>Não use pasta de dente, manteiga ou gelo. Não estoure bolhas.</li><li>Cubra com pano limpo e úmido.</li></ol></div>
<div class="card"><h3>Diarreia e desidratação</h3><p><b>Soro caseiro:</b> 1 litro de água tratada, 1 colher (de chá) rasa de sal e 2 colheres (de sopa) de açúcar. Dê aos poucos. Procure atendimento se houver sangue nas fezes, febre alta, ou se a pessoa parar de urinar. Crianças e idosos desidratam mais rápido.</p></div>
<div class="card"><h3>Engasgo (adulto)</h3><p>Se a pessoa não consegue falar nem tossir: fique atrás dela, abrace pela cintura, feche uma mão acima do umbigo e puxe para dentro e para cima com força, até desengasgar (manobra de Heimlich). Ligue 192.</p></div>
<div class="card"><h3>Kit de primeiros socorros</h3><p>Gaze, esparadrapo, atadura, curativos, soro fisiológico, luvas, tesoura, termômetro, analgésico, antialérgico, sais de reidratação e os <b>remédios de uso contínuo</b> da família para pelo menos 2 semanas.</p></div>`},
comunic:{ic:"📻",t:"Comunicação sem internet",sub:"Rádio, SMS e ponto de encontro",html:`
<p class="lead">Quando a internet cai, o celular ainda pode ligar e mandar SMS. Quando a rede de celular cai, entram o rádio e o combinado da família.</p>
<div class="card"><h3>Celular sem internet</h3><ul><li><b>SMS</b> gasta pouco sinal e costuma passar quando a ligação falha.</li><li>Mensagens curtas: "Estou bem. Indo para o ponto B. 14h."</li><li>Ligue só o necessário: rede congestionada piora para todos.</li></ul></div>
<div class="card"><h3>Rádio</h3><ul><li>Rádio AM/FM a pilha recebe avisos da Defesa Civil e das emissoras locais.</li><li>Rádios comunicadores (walkie-talkie) de uso livre funcionam de alguns centos de metros a poucos quilômetros, sem rede.</li><li>Rádio amador (PX e radioamador) exige licença da Anatel para transmitir.</li></ul></div>
<div class="card dica"><h3>O combinado da família</h3><p>Preencha o <b>Plano da família</b> (no menu): pontos de encontro, um contato de outra cidade que todos avisam, e quem busca as crianças. Imprima e deixe uma cópia na carteira de cada um.</p></div>`},
casa:{ic:"🏠",t:"Ficar em casa ou sair?",sub:"Como decidir com calma",html:`
<p class="lead">Na maioria das emergências, <b>ficar em casa</b> é o mais seguro. Saia quando a casa deixar de ser segura ou quando as autoridades mandarem.</p>
<div class="grid"><div class="card" style="margin:0"><h3>🏠 Fique se…</h3><ul><li>A casa está inteira e seca.</li><li>Há água e comida para alguns dias.</li><li>As autoridades pedem para ficar.</li><li>A rua é mais perigosa que a casa.</li></ul></div>
<div class="card" style="margin:0"><h3>🎒 Saia se…</h3><ul><li>Há risco de enchente, deslizamento ou incêndio.</li><li>A Defesa Civil manda evacuar.</li><li>Acabou a água e não há como tratar.</li><li>Alguém precisa de atendimento médico.</li></ul></div></div>
<div class="card"><h3>Se for sair</h3><ol><li>Pegue a <b>mochila de emergência</b> (veja Checklists).</li><li>Desligue o gás e a chave geral de energia.</li><li>Deixe um bilhete dizendo para onde foi e quando.</li><li>Use o <b>Mapa e direção</b> para ver o rumo e as cidades no caminho.</li><li>Vá de dia, em grupo, por rodovias conhecidas.</li></ol></div>`}
};
const CHECKS={
k72:{t:"Kit de 72 horas (em casa)",it:["Água: 4 litros por pessoa por dia, para 3 dias","Comida que não precisa de geladeira para 3 dias","Abridor de lata manual","Lanterna e pilhas reserva","Rádio a pilha","Power bank carregado","Kit de primeiros socorros","Remédios de uso contínuo (2 semanas)","Hipoclorito 2,5% ou pastilhas para tratar água","Fósforo ou isqueiro","Fogareiro e gás reserva","Sacos de lixo e lenço umedecido","Papel higiênico e itens de higiene","Dinheiro em espécie (notas pequenas)","Cópia dos documentos num saco plástico","Apito para pedir socorro","Comida e água do pet"]},
moch:{t:"Mochila de fuga (por pessoa)",it:["Garrafa ou cantil cheio + forma de tratar água","Comida leve para 1 a 2 dias","Lanterna de cabeça","Capa de chuva","Muda de roupa e meias","Manta térmica","Canivete ou multiferramenta","Mapa de papel da região (imprima o deste kit)","Bússola","Power bank e cabo","Remédios pessoais","Cópia de documentos e dinheiro","Apito","Lista de contatos em papel"]},
casa:{t:"Preparar a casa",it:["Saber onde fica o registro de água","Saber desligar a chave geral de energia","Saber fechar o gás","Extintor dentro da validade","Lanternas em lugares fáceis de achar","Galões de água limpos e cheios","Estoque de comida organizado por validade","Plano da família preenchido e impresso"]}
};

/* ================= NAVEGAÇÃO ================= */
const MENU=[["inicio","🏁","Início"],["agua"],["alim"],["mapa"],["orient"],["energia"],["socorro"],["comunic"],["casa"],["checks","✅","Checklists"],["plano","👪","Plano da família"],["imprimir","🖨️","Imprimir tudo"]];
let ATUAL=LS.get("pg","inicio");
function menu(){$("#nav").innerHTML=MENU.map(([k,ic,t])=>{const g=G[k];return`<button data-k="${k}" class="${k===ATUAL?"on":""}"><span class="ic">${ic||g.ic}</span>${t||g.t}</button>`}).join("");
 $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{ir(b.dataset.k);$("#nav").classList.remove("aberto")})}
function ir(k){ATUAL=k;LS.set("pg",k);menu();$("#main").scrollTop=0;window.scrollTo(0,0);
 if(k==="inicio")return inicio(); if(k==="mapa")return mapa(); if(k==="checks")return checks(); if(k==="plano")return plano(); if(k==="imprimir")return imprimir();
 const g=G[k];$("#main").innerHTML=`<div class="pg"><span class="eyebrow">${g.ic} ${esc(g.sub)}</span><h1>${esc(g.t)}</h1>${g.html}${g.calc?calcHTML():""}</div>`; if(g.calc)calcLiga();}
$("#mm").onclick=()=>$("#nav").classList.toggle("aberto");
function st(){const s=$("#st");if(navigator.onLine){s.classList.add("on");s.querySelector("span").textContent="Conectado · tudo também funciona offline"}else{s.classList.remove("on");s.querySelector("span").textContent="Sem internet · funcionando normalmente"}}
addEventListener("online",st);addEventListener("offline",st);

function inicio(){
 const feitos=Object.entries(CHECKS).reduce((a,[k,c])=>{const s=LS.get("ck_"+k,{});return[a[0]+c.it.filter((_,i)=>s[i]).length,a[1]+c.it.length]},[0,0]);
 $("#main").innerHTML=`<div class="pg"><span class="eyebrow">Plano B · funciona 100% sem internet</span><h1>Se a internet, a luz ou o GPS caírem, você continua sabendo o que fazer.</h1>
 <p class="lead">Tudo aqui está salvo neste arquivo. Não depende de site, aplicativo ou sinal. Guarde uma cópia no computador, no celular e num pendrive, e imprima o essencial.</p>
 <div class="card"><h3>Seu nível de preparo</h3><div class="big">${Math.round(feitos[0]/feitos[1]*100)}%</div><div class="prog"><i style="width:${feitos[0]/feitos[1]*100}%"></i></div><p style="color:var(--sua);font-size:14px">${feitos[0]} de ${feitos[1]} itens dos checklists prontos.</p></div>
 <div class="grid">${MENU.slice(1).map(([k,ic,t])=>{const g=G[k]||{};return`<button class="tile" data-k="${k}"><span class="ic">${ic||g.ic}</span><b>${t||g.t}</b><span>${esc(g.sub||({checks:"Kit 72h, mochila de fuga, casa",plano:"Pontos de encontro e contatos",imprimir:"Versão em papel de tudo"})[k]||"")}</span></button>`}).join("")}</div>
 <div class="card dica" style="margin-top:18px"><h3>Primeiros 3 passos</h3><ol><li>Preencha o <b>Plano da família</b>.</li><li>Marque o que já tem nos <b>Checklists</b> e compre o que falta.</li><li>Clique em <b>Imprimir tudo</b> e guarde o papel junto do kit.</li></ol></div></div>`;
 $("#main").querySelectorAll(".tile").forEach(b=>b.onclick=()=>ir(b.dataset.k));}

/* ================= CALCULADORA ================= */
function calcHTML(){const c=LS.get("calc",{ad:2,cr:1,id:0,pet:0,dias:7});
 return`<h2>🧮 Calculadora de estoque</h2><div class="card"><div class="row">
 <div><label class="f">Adultos</label><input type="number" min="0" max="30" id="c-ad" value="${c.ad}"></div><div><label class="f">Crianças</label><input type="number" min="0" max="30" id="c-cr" value="${c.cr}"></div>
 <div><label class="f">Idosos</label><input type="number" min="0" max="30" id="c-id" value="${c.id}"></div><div><label class="f">Pets</label><input type="number" min="0" max="20" id="c-pet" value="${c.pet}"></div>
 <div><label class="f">Dias</label><select id="c-dias">${[3,7,14,30].map(d=>`<option ${+c.dias===d?"selected":""} value="${d}">${d} dias</option>`).join("")}</select></div></div><div id="c-res"></div>
 <p style="color:var(--sua);font-size:13.5px;margin-top:10px">Estimativa para planejamento: cerca de 2.000 kcal por adulto por dia, 1.400 por criança e 1.800 por idoso. Ajuste à realidade da sua família e a necessidades médicas.</p></div>`}
function calcLiga(){const f=()=>{const v=k=>Math.max(0,+$("#c-"+k).value||0),c={ad:v("ad"),cr:v("cr"),id:v("id"),pet:v("pet"),dias:+$("#c-dias").value};LS.set("calc",c);
 const p=c.ad+c.cr+c.id,d=c.dias,agua=p*4*d+c.pet*1*d,kcal=(c.ad*2000+c.cr*1400+c.id*1800)*d;
 const L=[["Água (galões de 20 L)",Math.ceil(agua/20)+" galões",n0(agua)+" litros"],["Arroz",n1(p*d*0.1)+" kg","~100 g por pessoa/dia"],["Feijão",n1(p*d*0.06)+" kg","~60 g por pessoa/dia"],["Macarrão ou farinha",n1(p*d*0.06)+" kg","~60 g por pessoa/dia"],["Enlatados (atum, sardinha, carne)",Math.ceil(p*d*0.7)+" latas","~1 lata a cada 1,5 dia por pessoa"],["Leite em pó",n1(p*d*0.03)+" kg","~30 g por pessoa/dia"],["Óleo",n1(p*d*0.02)+" L","~20 ml por pessoa/dia"],["Hipoclorito 2,5%",Math.max(1,Math.ceil(agua*0.1/50))+" frascos de 50 ml","2 gotas por litro"],["Pilhas AA",Math.ceil(p*2+d/2)+" unidades","lanternas e rádio"]];
 $("#c-res").innerHTML=`<div class="kv" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div><small>Pessoas</small><b>${p}</b></div><div><small>Água total</small><b>${n0(agua)} L</b></div><div><small>Energia total</small><b>${n0(kcal/1000)} mil kcal</b></div></div>
 <table style="margin-top:12px"><tr><th>Item</th><th class="num">Quantidade</th><th>Base</th></tr>${L.map(r=>`<tr><td>${r[0]}</td><td class="num"><b>${r[1]}</b></td><td style="color:var(--sua);font-size:13.5px">${r[2]}</td></tr>`).join("")}</table>`};
