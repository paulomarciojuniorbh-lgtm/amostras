<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hélice CRM · Execução de contrato</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1730">
<link rel="icon" href="../marca/helice-simbolo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Ferramenta de trabalho: denso no computador, uma coluna e botões grandes no celular do promotor */
:root{
  --fundo:#f3f5fa; --card:#fff; --texto:#0f1730; --suave:#5b6687; --fraco:#8b94b0; --linha:#e2e7f2; --hover:#f7f9fd;
  --azul:#3366f0; --azul-bg:#eaf0ff; --escuro:#0f1730;
  --ok:#1a9560; --ok-bg:#e6f6ee; --med:#c27a00; --med-bg:#fff3df; --ruim:#d1453b; --ruim-bg:#fdeceb;
  --f:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--fundo);color:var(--texto);font:400 14.5px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul)}
.w{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{background:var(--escuro);color:#fff;padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:30}
.top{display:flex;align-items:center;gap:14px;height:56px}
.top .marca{display:flex;align-items:center;gap:8px;font-weight:700}
.top .marca img{width:22px;height:22px;filter:brightness(0) invert(1)}
.top .marca span{color:#8fa0d0;font-weight:500}
.top nav{display:flex;gap:4px;margin-left:18px;overflow-x:auto;scrollbar-width:none}
.top nav button{background:none;border:0;color:#b8c3e6;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:500}
.top nav button[aria-current=page]{background:rgba(255,255,255,.12);color:#fff}
.top .eu{margin-left:auto;text-align:right;font-size:12.5px;color:#b8c3e6;line-height:1.25;white-space:nowrap}
.top .eu b{display:block;color:#fff;font-size:13.5px}
@media (max-width:720px){.top{height:auto;flex-wrap:wrap;padding:10px 0 0}.top nav{order:3;width:100%;margin:6px 0 0;padding-bottom:8px}.top .eu{font-size:11.5px}}
main{padding:22px 0 90px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.015em}
h2{font-size:16px;margin:0 0 12px;letter-spacing:-.01em}
.sub{color:var(--suave);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:18px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--suave)}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;font-weight:500;color:var(--fraco);padding:8px;border-bottom:1px solid var(--linha);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:10px 8px;border-bottom:1px solid var(--linha);vertical-align:middle}
tbody tr.clic{cursor:pointer}tbody tr.clic:hover{background:var(--hover)}
.num{text-align:right}
.tab-scroll{overflow:auto;max-height:70vh}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-med{background:var(--med-bg);color:var(--med)}.p-ruim{background:var(--ruim-bg);color:var(--ruim)}.p-nd{background:#eef1f7;color:var(--fraco)}.p-az{background:var(--azul-bg);color:var(--azul)}
.muted{color:var(--fraco);font-size:12.5px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros input,.filtros select{border:1px solid var(--linha);background:var(--card);border-radius:10px;padding:9px 12px;min-width:0}
.filtros input{flex:1 1 220px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--azul);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none;justify-content:center}
.btn.sec{background:var(--azul-bg);color:var(--azul)}
.btn.zap{background:#25d366;color:#06331b}
.btn.peq{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.barras{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.barras div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.barras i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--azul)}
.barras small{font-size:10.5px;color:var(--fraco);white-space:nowrap}
.barras em{font-style:normal;font-size:11px;font-weight:600}
.vazio{text-align:center;color:var(--suave);padding:28px 10px}
.vazio b{display:block;color:var(--texto);font-size:15px;margin-bottom:4px}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,48,.45);display:flex;justify-content:flex-end}
.painel{background:var(--fundo);width:min(980px,100%);height:100%;overflow:auto;padding:0 0 40px;box-shadow:-20px 0 50px rgba(0,0,0,.15)}
.painel .cab{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--linha);padding:14px 18px;display:flex;align-items:center;gap:12px;z-index:2}
.painel .cab h1{font-size:18px;margin:0}
.painel .cab .fechar{margin-left:auto;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--suave);padding:4px 8px}
.painel .corpo{padding:16px 18px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campos label{display:grid;gap:4px;font-size:12.5px;color:var(--suave);min-width:0}
.campos .full{grid-column:1/-1}
.campos input,.campos select,.campos textarea{width:100%;min-width:0;border:1px solid var(--linha);border-radius:10px;padding:9px 11px;background:var(--card);font-size:14.5px;color:var(--texto)}
@media (max-width:560px){.campos{grid-template-columns:1fr}}
/* checklist */
.grupo{margin:18px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.item{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:14px;margin-bottom:10px}
.item .l1{display:flex;align-items:flex-start;gap:12px}
.item .l1 div{flex:1}
.item b{display:block;font-weight:600}
.item small{color:var(--suave);font-size:12.5px}
.item .ctrl{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.step{display:flex;align-items:center;border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.step button{width:46px;height:46px;border:0;background:var(--hover);font-size:22px;cursor:pointer}
.step output{min-width:54px;text-align:center;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sn{display:flex;border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.sn button{padding:12px 20px;border:0;background:var(--card);font-weight:600;cursor:pointer;min-width:72px}
.sn button[aria-pressed=true].sim{background:var(--ok);color:#fff}
.sn button[aria-pressed=true].nao{background:var(--ruim);color:#fff}
.pctin{display:flex;align-items:center;gap:6px}
.pctin input{width:90px;border:1px solid var(--linha);border-radius:12px;padding:11px;font-size:18px;font-weight:600;text-align:center}
.foto{margin-left:auto;display:flex;align-items:center;gap:8px}
.foto label{display:inline-flex;align-items:center;gap:6px;padding:10px 12px;border-radius:10px;background:var(--azul-bg);color:var(--azul);font-weight:600;font-size:13px;cursor:pointer}
.foto img{width:46px;height:46px;border-radius:8px;object-fit:cover}
.meta-tag{font-size:12px;font-weight:600;color:var(--suave);background:#eef1f7;border-radius:6px;padding:2px 7px;margin-left:6px}
.barra-fixa{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--linha);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:3}
.barra-fixa .pctg{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.minhas .loja{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.minhas .loja div{flex:1}
.minhas .loja b{display:block;font-size:15.5px}
.hist{border-top:1px solid var(--linha);padding:12px 0}
.hist .fotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hist .fotos a img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.meta-in{width:70px;border:1px solid var(--linha);border-radius:8px;padding:5px 7px;text-align:right}
.lista-sel{max-height:46vh;overflow:auto;border:1px solid var(--linha);border-radius:12px;background:var(--card)}
.lista-sel label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--linha);cursor:pointer}
.lista-sel label:hover{background:var(--hover)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--escuro);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:90;font-weight:500}
.toast.on{opacity:1}
.gate{max-width:420px;margin:90px auto;text-align:center;padding:0 20px}
.ld{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:g .7s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:820px){.segs{grid-template-columns:repeat(2,1fr)}}
.segb{border:1px solid var(--linha);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.segb:hover{border-color:var(--azul)}.segb b{font-size:22px;font-variant-numeric:tabular-nums}.segb span{font-size:12.5px;color:var(--suave)}
.segb.ok b{color:var(--ok)}.segb.ruim b{color:var(--ruim)}.segb.med b{color:var(--med)}
.chips-seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.chips-seg button{white-space:nowrap;border:1px solid var(--linha);background:var(--card);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px}
.chips-seg button b{color:var(--suave);font-weight:600;margin-left:2px}
.chips-seg button[aria-pressed=true]{background:var(--escuro);color:#fff;border-color:var(--escuro)}.chips-seg button[aria-pressed=true] b{color:#b8c3e6}
.ltabs{display:flex;gap:2px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--linha);padding:0 12px;position:sticky;top:61px;z-index:2;scrollbar-width:none}
.ltabs button{border:0;background:none;padding:12px 12px;font-weight:500;color:var(--suave);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.ltabs button[aria-pressed=true]{color:var(--azul);border-bottom-color:var(--azul)}
</style>
</head>
<body>
<header><div class="w top">
  <div class="marca"><img src="../marca/helice-simbolo.svg" alt="">Hélice <span>CRM</span></div>
  <nav id="nav" hidden></nav>
  <div class="eu" id="eu"></div>
</div></header>
<main class="w" id="app"><p class="sub" style="text-align:center;margin-top:60px">Carregando…</p></main>
<div class="modal" id="modal" hidden><div class="painel" id="painel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<script>
const SB='https://ryhyvzwqtktaaonznizn.supabase.co',KEY='sb_publishable_Ji31DC1ihqZTR7gmLeYTLw_GHgBjWN0';
const $=s=>document.querySelector(s), esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rpc=(f,b)=>fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const pub=p=>SB+'/storage/v1/object/public/crm/'+p;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
const FORM={atacarejo:'Atacarejo',varejo:'Varejo',conveniencia:'Conveniência',mais_fraldas:'Mais Fraldas',farma:'Farma'};
const PERF={exec:'Executivo de contas',coord:'Coordenador',promotor:'Promotor'};
const pctPill=p=>p==null?'<span class="pill p-nd">sem checagem</span>':`<span class="pill ${p>=90?'p-ok':p>=70?'p-med':'p-ruim'}">${String(p).replace('.',',')}%</span>`;
const dataBR=s=>s?new Date(s+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'—';
const telZap=t=>{let d=String(t||'').replace(/\D/g,'');if(!d)return null;if(d.length<=11)d='55'+d;return d};

/* token: chega por #t=..., fica guardado no aparelho */
let TOK=null;try{TOK=localStorage.getItem('helice_crm_tok')}catch(e){}
const mt=location.hash.match(/t=([a-f0-9]{20,})/);if(mt){TOK=mt[1];try{localStorage.setItem('helice_crm_tok',TOK)}catch(e){}history.replaceState(null,'',location.pathname)}
let D=null,aba='painel',HASH=null;
async function hashTok(){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(TOK));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

async function carregar(){
  if(!TOK){gate();return}
  try{D=await rpc('crm_painel',{p_token:TOK})}catch(e){$('#app').innerHTML='<div class="gate"><h1>Sem conexão</h1><p class="sub">Confira a internet e tente de novo.</p><button class="btn" onclick="location.reload()">Tentar de novo</button></div>';return}
  if(!D.ok){try{localStorage.removeItem('helice_crm_tok')}catch(e){}TOK=null;gate('Este link não é mais válido. Peça um novo ao seu executivo de contas.');return}
  D.P=Object.fromEntries(D.pessoas.map(p=>[p.id,p]));D.PT=Object.fromEntries(D.pontos.map(p=>[p.id,p]));
  $('#eu').innerHTML=`<b>${esc(D.eu.nome)}</b>${PERF[D.eu.perfil]} · <a href="#" id="sair" style="color:#b8c3e6">sair</a>`;
  $('#sair').onclick=e=>{e.preventDefault();if(confirm('Sair deste aparelho? Para entrar de novo você vai precisar do seu link.')){try{localStorage.removeItem('helice_crm_tok')}catch(x){}location.reload()}};
  const abas=D.eu.perfil==='promotor'?[]:D.eu.perfil==='exec'?[['painel','Painel'],['lojas','Mapa da carteira'],['equipe','Equipe'],['band','Bandeiras'],['pend','Pendências'],['imp','Importar dados']]:[['painel','Painel'],['lojas','Mapa da carteira'],['band','Bandeiras'],['pend','Pendências']];
  const n=$('#nav');n.hidden=!abas.length;n.innerHTML=abas.map(([k,t])=>`<button data-a="${k}" ${k===aba?'aria-current="page"':''}>${t}</button>`).join('');
  n.querySelectorAll('button').forEach(b=>b.onclick=()=>{aba=b.dataset.a;n.querySelectorAll('button').forEach(x=>x.toggleAttribute('aria-current',x===b));if(b.hasAttribute('aria-current'))b.setAttribute('aria-current','page');render();scrollTo(0,0)});
  render();
}
function gate(msg){$('#app').innerHTML=`<div class="gate"><h1>Hélice CRM</h1><p class="sub">${msg||'Acesse pelo seu link pessoal. Se você ainda não tem, peça ao seu executivo de contas.'}</p></div>`}
function render(){
  if(D.eu.perfil==='promotor'){$('#app').innerHTML=vPromotor();ligarPromotor();return}
  $('#app').innerHTML=({painel:vPainel,lojas:vLojas,equipe:vEquipe,pend:vPend,band:vBand,imp:vImp})[aba]();
  ({lojas:ligarLojas,equipe:ligarEquipe,pend:ligarPend,painel:ligarPainel,band:ligarBand,imp:ligarImp})[aba]?.();
}
const comProm=()=>D.lojas.filter(l=>l.promotor_id);
const media=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length*10)/10:null;

/* ---------- detalhe da loja ---------- */
function abrir(html){$('#painel').innerHTML=html;$('#modal').hidden=false;document.body.style.overflow='hidden';$('#painel').scrollTop=0;$('#painel .fechar')?.addEventListener('click',fechar)}
function fechar(){$('#modal').hidden=true;document.body.style.overflow=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')fechar()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)fechar()});

async function recarregar(){const R=await rpc('crm_painel',{p_token:TOK});if(R.ok){D=R;D.P=Object.fromEntries(D.pessoas.map(p=>[p.id,p]));D.PT=Object.fromEntries(D.pontos.map(p=>[p.id,p]))}}

/* ---------- checklist ---------- */
const ratio=(v,m)=>v==null||!m?null:Math.min(v/m,1);
function checklist(l,metas){
  const V={},F={};metas.forEach(m=>{V[m.ponto_id]=m.atual??(m.p.periodicidade==='mensal'?m.mes:null)??null});
  const grupos=[...new Set(metas.map(m=>m.p.grupo))];
  abrir(`<div class="cab"><div><h1>Checagem · ${esc(l.nome)}</h1><div class="muted">Semana de ${dataBR(D.semana)}. Marque o que você encontrou na loja hoje.</div></div><button class="fechar" aria-label="Fechar">×</button></div>
  <div class="corpo">${grupos.map(g=>`<div class="grupo">${esc(g)}</div>${metas.filter(m=>m.p.grupo===g).map(m=>`<div class="item" data-i="${m.ponto_id}"><div class="l1"><div><b>${esc(m.p.nome)}${m.p.periodicidade==='mensal'?'<span class="meta-tag">1x por mês</span>':''}</b><small>${m.p.tipo==='qtd'?'Meta: '+m.meta:m.p.tipo==='pct'?'Meta: '+m.meta+'% do espaço':'Precisa estar: Sim'}${m.p.descricao?' · '+esc(m.p.descricao):''}</small></div></div>
    <div class="ctrl">${m.p.tipo==='qtd'?`<div class="step"><button type="button" data-d="-1" aria-label="Menos">−</button><output>${V[m.ponto_id]??'–'}</output><button type="button" data-d="1" aria-label="Mais">+</button></div>`:m.p.tipo==='simnao'?`<div class="sn"><button type="button" class="sim" aria-pressed="${V[m.ponto_id]===1}">Sim</button><button type="button" class="nao" aria-pressed="${V[m.ponto_id]===0}">Não</button></div>`:`<div class="pctin"><input type="number" inputmode="decimal" min="0" max="100" value="${V[m.ponto_id]??''}" placeholder="–" aria-label="Percentual">%</div>`}
    <div class="foto"><img hidden alt=""><label>📷 Foto<input type="file" accept="image/*" capture="environment" hidden></label></div></div></div>`).join('')}`).join('')}
  <label class="campos" style="display:grid;margin-top:16px"><span class="muted">Observação (opcional)</span><textarea id="c-obs" rows="2" placeholder="Ex.: gerente pediu mais produto para a ilha" style="border:1px solid var(--linha);border-radius:10px;padding:10px"></textarea></label></div>
  <div class="barra-fixa"><div><div class="pctg" id="c-pct">–</div><div class="muted" id="c-falta"></div></div><button class="btn" id="c-env" style="margin-left:auto;padding:13px 22px">Enviar checagem</button></div>`);
  const atual=()=>{const r=metas.map(m=>ratio(V[m.ponto_id],m.meta)).filter(x=>x!=null);const falta=metas.filter(m=>V[m.ponto_id]==null).length;$('#c-pct').textContent=r.length?String(Math.round(r.reduce((a,b)=>a+b,0)/r.length*1000)/10).replace('.',',')+'%':'–';$('#c-pct').style.color=!r.length?'':r.reduce((a,b)=>a+b,0)/r.length>=.9?'var(--ok)':r.reduce((a,b)=>a+b,0)/r.length>=.7?'var(--med)':'var(--ruim)';$('#c-falta').textContent=falta?falta+' item(ns) sem resposta':'tudo respondido'};
  document.querySelectorAll('.item').forEach(el=>{const id=+el.dataset.i;
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{V[id]=Math.max(0,(V[id]??0)+(+b.dataset.d));el.querySelector('output').textContent=V[id];atual()});
    el.querySelectorAll('.sn button').forEach(b=>b.onclick=()=>{V[id]=b.classList.contains('sim')?1:0;el.querySelectorAll('.sn button').forEach(x=>x.setAttribute('aria-pressed',x===b));atual()});

function reduzir(f){return new Promise(res=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b||f),'image/jpeg',.8)};img.onerror=()=>res(f);img.src=URL.createObjectURL(f)})}

function irPara(a){aba=a;document.querySelectorAll('#nav button').forEach(x=>{x.removeAttribute('aria-current');if(x.dataset.a===a)x.setAttribute('aria-current','page')});render();scrollTo(0,0)}

/* ---------- mapa da carteira ---------- */

  <div class="filtros"><input id="f-q" placeholder="Buscar loja, cidade ou número" value="${esc(FL.q)}" aria-label="Buscar">

let FILT=[];
function filtrarLojas(){
  const q=FL.q.toLowerCase(),sg=SEG.find(s=>s[0]===FL.seg)[2];
  FILT=D.lojas.filter(l=>sg(l)&&(!q||(l.nome+' '+l.id+' '+(l.cidade||'')).toLowerCase().includes(q))&&(!FL.b||l.bandeira===FL.b)&&(!FL.uf||l.uf===FL.uf));
  const o={vendas:(a,b)=>(b.ytd||0)-(a.ytd||0),queda:(a,b)=>((a.ytd||0)-(a.ytd_ant||0))-((b.ytd||0)-(b.ytd_ant||0)),cresc:(a,b)=>(var_(b.ytd,b.ytd_ant)??-999)-(var_(a.ytd,a.ytd_ant)??-999),contrato:(a,b)=>(a.ult_pct??999)-(b.ult_pct??999),nome:(a,b)=>a.nome.localeCompare(b.nome)}[FL.ord];
  FILT.sort(o);
  $('#t-lojas').innerHTML=FILT.length?`<table><thead><tr><th>Loja</th><th>Promotor</th><th class="num">Contrato</th><th class="num">Vendas no ano</th><th class="num">× ano ant.</th><th class="num">Estoque 4 sem</th><th class="num">Grade</th><th>Diagnóstico</th></tr></thead><tbody>${FILT.slice(0,500).map(l=>`<tr class="clic" data-loja="${l.id}">
    <td><b>${esc(l.nome)}</b><div class="muted">#${l.id} · ${esc(l.bandeira||'')} · ${esc(l.cidade||'')}${l.uf?' '+l.uf:''}</div></td>
    <td>${l.promotor_id?esc(D.P[l.promotor_id]?.nome||'—'):'<span class="muted">sem</span>'}${l.pmarca?' <span class="pill p-az">marca</span>':''}</td>
    <td class="num">${l.ult_pct==null?'<span class="muted">—</span>':pctPill(l.ult_pct)}</td><td class="num">${l.ytd?brl(l.ytd):'—'}</td><td class="num">${varPill(var_(l.ytd,l.ytd_ant))}</td>
    <td class="num">${varPill(var_(l.est,l.est_ant))}${(l.neg||0)+(l.zero||0)?` <span class="pill p-ruim" title="categorias com estoque zerado ou negativo">${(l.neg||0)+(l.zero||0)}⚠</span>`:''}</td>
    <td class="num">${l.grade==null?'—':l.grade+(l.grade_ant!=null&&l.grade!==l.grade_ant?` <span class="muted">(${l.grade>l.grade_ant?'+':''}${l.grade-l.grade_ant})</span>`:'')}</td><td>${diagPill(l.diag)}</td></tr>`).join('')}</tbody></table>`:'<div class="vazio"><b>Nenhuma loja nesse filtro</b></div>';
  document.querySelectorAll('#t-lojas [data-loja]').forEach(r=>r.onclick=()=>abrirLoja(+r.dataset.loja));
  document.querySelectorAll('#segs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===FL.seg));
}
function ligarLojas(){
  const s=(k,id,ev='change')=>{$(id).addEventListener(ev,e=>{FL[k]=e.target.value;filtrarLojas()})};
  s('q','#f-q','input');s('b','#f-b');s('uf','#f-uf');s('ord','#f-o');
  document.querySelectorAll('#segs button').forEach(b=>b.onclick=()=>{FL.seg=b.dataset.s;filtrarLojas()});
  $('#f-csv').onclick=()=>{const c=v=>`"${String(v??'').replace(/"/g,'""')}"`;const linhas=[['Loja','Nome','Bandeira','Cidade','UF','Promotor','Promotor de marca','Contrato %','Vendas ano','Vendas ano anterior','Var %','Estoque','Estoque 4 sem antes','Grade','Grade antes','Diagnostico'].join(';'),
    ...FILT.map(l=>[l.id,l.nome,l.bandeira,l.cidade,l.uf,D.P[l.promotor_id]?.nome||'',l.pmarca?'sim':'',l.ult_pct??'',l.ytd??'',l.ytd_ant??'',var_(l.ytd,l.ytd_ant)??'',l.est??'',l.est_ant??'',l.grade??'',l.grade_ant??'',DIAG[l.diag]?.[0]||''].map(c).join(';'))];
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+linhas.join('\n')],{type:'text/csv'}));a.download='carteira.csv';a.click()};
  filtrarLojas();
}

      <div class="kpi"><b style="font-size:20px">${nf(r.est_ult)} un</b><span>estoque ${varPill(var_(r.est_ult,r.est_ant))} em 4 sem</span></div>
      <div class="kpi"><b style="font-size:20px">${r.grade_ult??'—'} SKUs</b><span>grade ${r.grade_ant!=null&&r.grade_ult!=null?(r.grade_ult-r.grade_ant>0?'+':'')+(r.grade_ult-r.grade_ant)+' em 4 sem':''}</span></div>
      <div class="kpi"><b style="font-size:20px">${ultC?String(ultC.pct).replace('.',',')+'%':'—'}</b><span>contrato ${ultC?'em '+dataBR(ultC.semana):'(nunca checado)'}</span></div></div>

    if(at==='notas')$('#n-s').onclick=async()=>{const t=$('#n-x').value.trim(),a=$('#n-a').value.trim();if(!t&&!a){toast('Escreva a anotação.');return}$('#n-s').disabled=true;
      const x=await rpc('crm_salvar_nota',{p_token:TOK,p:{loja:l.id,tipo:$('#n-t').value,texto:t,proxima_acao:a,prazo:$('#n-p').value}}).catch(()=>({}));
      if(x.ok){toast('Anotação salva.');await recarregar();abrirLoja(l.id,'notas')}else{toast('Não consegui salvar.');$('#n-s').disabled=false}};
    if(at==='contrato'&&ex)document.querySelectorAll('[data-meta]').forEach(i=>i.onchange=async()=>{const v=i.value===''?null:+i.value;const x=await rpc('crm_salvar_meta',{p_token:TOK,p_loja:l.id,p_ponto:+i.dataset.meta,p_meta:v}).catch(()=>({}));toast(x.ok?'Meta atualizada.':'Não consegui salvar.')});
    if(at==='dados'&&ex)ligarDados(l);
  };draw();
}
const TIPO={visita:'🚶 Visita',ligacao:'📞 Ligação',negociacao:'🤝 Negociação',nota:'📝 Anotação'};
const nota=n=>`<div class="hist"><div style="display:flex;justify-content:space-between;gap:10px"><b>${TIPO[n.tipo]||n.tipo}</b><span class="muted">${new Date(n.criado_em).toLocaleDateString('pt-BR')}${n.quem?' · '+esc(n.quem):''}</span></div>${n.texto?`<p style="margin:6px 0 0;white-space:pre-wrap">${esc(n.texto)}</p>`:''}${n.proxima_acao?`<div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="pill ${n.feito?'p-ok':n.prazo&&n.prazo<D.hoje?'p-ruim':'p-med'}">${n.feito?'✓ feito':'próxima ação'}</span> ${esc(n.proxima_acao)}${n.prazo?' <span class="muted">até '+dataBR(n.prazo)+'</span>':''}${!n.feito?` <button class="btn sec peq" data-feito="${n.id}">Concluir</button>`:''}</div>`:''}</div>`;
function graficoEstoque(S){if(!S||!S.length)return '';const mx=Math.max(...S.map(s=>+s.unidades||0),1);
  return `<div class="barras" style="height:150px">${S.map(s=>`<div title="${dataBR(s.data)}: ${nf(s.unidades)} un · grade ${s.grade}${s.neg?' · '+s.neg+' cat. negativas':''}"><i style="height:${Math.max(3,s.unidades/mx*100)}%;background:${s.neg?'var(--ruim)':'#5b8def'};max-width:18px"></i><small>${dataBR(s.data).slice(0,5)}</small></div>`).join('')}</div><p class="muted" style="margin:6px 0 0">Barras vermelhas: semanas com alguma categoria negativa.</p>`}
function dadosLoja(l,ex){const proms=D.pessoas.filter(p=>p.perfil==='promotor'),coords=D.pessoas.filter(p=>p.perfil==='coord'),d=ex?'':'disabled';
  return `<div class="card"><h2>Dados e equipe da loja</h2><div class="campos">
    <label>Cidade<input id="l-ci" value="${esc(l.cidade||'')}" ${d}></label><label>UF<input id="l-uf" value="${esc(l.uf||'')}" maxlength="2" style="text-transform:uppercase" ${d}></label>
    <label>Gerente da loja<input id="l-gn" value="${esc(l.gerente_nome||'')}" ${d}></label><label>Telefone do gerente<input id="l-gt" value="${esc(l.gerente_tel||'')}" inputmode="tel" ${d}></label>
    <label>Aniversário do gerente<input id="l-gd" type="date" value="${l.gerente_nasc||''}" ${d}></label><label>&nbsp;</label>
    <label>Promotor<select id="l-pr" ${d}><option value="">Sem promotor</option>${proms.map(p=>`<option value="${p.id}" ${l.promotor_id===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></label>
    <label>Coordenador<select id="l-co" ${d}><option value="">—</option>${coords.map(p=>`<option value="${p.id}" ${l.coord_id===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></label>
    <label style="align-content:end"><span style="display:flex;align-items:center;gap:8px;padding:10px 0;color:var(--texto);font-size:14.5px"><input type="checkbox" id="l-pm" ${l.promotor_marca?'checked':''} ${d} style="width:18px;height:18px">Tem promotor de marca</span></label>
    <label>Promotor de marca: quem / qual marca<input id="l-pmo" value="${esc(l.promotor_marca_obs||'')}" ${d}></label>
    <label>Tamanho${l.tamanho_proposta&&l.tamanho_proposta!==l.tamanho?` <span class="muted">(proposta trade: ${esc(l.tamanho_proposta)})</span>`:''}<select id="l-tm" ${d}>${['','P','M','G'].map(t=>`<option ${l.tamanho===t||(!l.tamanho&&!t)?'selected':''} value="${t}">${t||'—'}</option>`).join('')}</select></label>
    <label>Check-outs / checkstands<div style="display:flex;gap:6px"><input id="l-co2" type="number" min="0" value="${l.checkouts??''}" ${d} style="flex:1;min-width:0"><input id="l-cs" type="number" min="0" value="${l.checkstands??''}" ${d} style="flex:1;min-width:0"></div></label>
    <label class="full">Observações<textarea id="l-ob" rows="2" ${d}>${esc(l.obs||'')}</textarea></label></div>${ex?'<button class="btn" id="b-sl" style="margin-top:12px">Salvar dados da loja</button>':''}</div>`}
function ligarDados(l){
  $('#l-pr').onchange=e=>{const p=D.P[e.target.value];if(p?.coord_id)$('#l-co').value=p.coord_id};
  $('#b-sl').onclick=async()=>{$('#b-sl').disabled=true;const r=await rpc('crm_salvar_loja',{p_token:TOK,p:{id:l.id,cidade:$('#l-ci').value,uf:$('#l-uf').value,gerente_nasc:$('#l-gd').value,promotor_marca:$('#l-pm').checked,promotor_marca_obs:$('#l-pmo').value.trim(),gerente_nome:$('#l-gn').value.trim(),gerente_tel:$('#l-gt').value.trim(),promotor_id:$('#l-pr').value,coord_id:$('#l-co').value,tamanho:$('#l-tm').value,checkouts:$('#l-co2').value,checkstands:$('#l-cs').value,obs:$('#l-ob').value}}).catch(()=>({}));
    if(r.ok){toast('Loja salva.');await recarregar();abrirLoja(l.id,'dados')}else{toast('Não consegui salvar.');$('#b-sl').disabled=false}};
}

/* ---------- promotor ---------- */
function vPromotor(){
  const L=D.lojas,feitas=L.filter(l=>!pendente(l)).length;
  return `<div class="minhas"><h1>Olá, ${esc(D.eu.nome.split(' ')[0])}!</h1><p class="sub">Checagem ${FREQ[D.freq]||''} · ${feitas} de ${L.length} lojas em dia.</p>
  ${L.length?L.map(l=>`<button class="loja" data-loja="${l.id}"><div><b>${esc(l.nome)}</b><span class="muted">${esc(l.cidade||'')} ${esc(l.uf||'')} · ${l.ult_sem?'última em '+dataBR(l.ult_sem):'nunca checada'}</span></div>${!pendente(l)?pctPill(l.ult_pct):'<span class="pill p-az">fazer checagem</span>'}</button>`).join(''):'<div class="card vazio"><b>Nenhuma loja atribuída a você</b>Fale com o seu coordenador.</div>'}</div>`;
}

/* ---------- pendências ---------- */
function vPend(){
  const ps=D.pessoas.filter(p=>p.perfil==='promotor').map(p=>({p,f:D.lojas.filter(l=>l.promotor_id===p.id&&pendente(l))})).filter(x=>x.f.length);
  return `<h1>Pendências de checagem</h1><p class="sub">Lojas com promotor sem checagem desde ${dataBR(iniPeriodo())}.</p>
  ${D.eu.perfil==='exec'?`<div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><b>Frequência da checagem:</b><select id="fq" style="border:1px solid var(--linha);border-radius:10px;padding:8px 10px">${Object.entries(FREQ).map(([k,t])=>`<option value="${k}" ${D.freq===k?'selected':''}>${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select><span class="muted">Vale para a cobrança e para a tela dos promotores.</span></div>`:''}
  ${ps.length?`<div class="card"><table><tbody>${ps.map(({p,f})=>{const z=telZap(p.telefone);const msg=`Oi, ${p.nome.split(' ')[0]}! Tudo bem? Faltam ${f.length} checagem(ns): ${f.map(l=>l.nome).join(', ')}. Consegue enviar?${p.token?' Seu link: '+linkDe(p.token):''}`;return `<tr><td><b>${esc(p.nome)}</b><div class="muted">${f.map(l=>esc(l.nome)).join(' · ')}</div></td><td class="num">${f.length}</td><td style="text-align:right">${z?`<a class="btn zap peq" target="_blank" rel="noopener" href="https://wa.me/${z}?text=${encodeURIComponent(msg)}">Lembrar no WhatsApp</a>`:'<span class="muted">sem telefone</span>'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="card vazio"><b>Tudo em dia 🎉</b></div>'}`;
}
function ligarPend(){$('#fq')&&($('#fq').onchange=async e=>{const r=await rpc('crm_salvar_config',{p_token:TOK,p_chave:'freq_checagem',p_valor:e.target.value}).catch(()=>({}));if(r.ok){D.freq=e.target.value;toast('Frequência atualizada.');render()}})}

/* ---------- importar dados ---------- */
const IMPS={};
const TIPOS_IMP={
  vendas:{titulo:'Vendas (sell-out)',rpc:'crm_importar_vendas',cols:[['loja','Loja',/loja|filial/,1],['mes','Mês',/mes|data|periodo|compet/,0],['valor','Valor (R$)',/valor|fatur|receita|vendas?$|r\$/,0],['vol','Volume',/volume|peso|kg|ton/,0],['categoria','Categoria',/categ/,0],['sku','SKU / produto',/sku|produto|material|cod.*prod/,0]]},
  estoque:{titulo:'Estoque',rpc:'crm_importar_estoque',cols:[['loja','Loja',/loja|filial/,1],['data','Data da leitura',/data|semana|atualiza/,1],['categoria','Categoria',/categ/,0],['unidades','Estoque (unidades)',/estoque|qtd|quant|unid|saldo/,1],['grade','Grade (nº de SKUs)',/grade|mix|sku/,0]]}};
function vImp(){return `<h1>Importar dados</h1><p class="sub">Suba as planilhas do sistema. A chave é a loja (número ou "17 - MATEUS…"). Carregar o mesmo período de novo substitui os números, não duplica. Lojas que ainda não existem no CRM são criadas automaticamente.</p>
  ${Object.entries(TIPOS_IMP).map(([k,t])=>`<div class="card"><h2>${t.titulo}</h2><input type="file" accept=".xlsx,.xls,.csv" data-imp="${k}"><div id="imp-${k}"></div></div>`).join('')}
  <div class="card"><h2>Recalcular diagnósticos</h2><p class="muted" style="margin:0 0 10px">Feito automaticamente depois de cada importação. Use se algo parecer desatualizado.</p><button class="btn sec" id="b-rec">Recalcular agora</button> <span class="muted" id="rec-st"></span></div>`}
function ligarImp(){
  document.querySelectorAll('[data-imp]').forEach(i=>i.onchange=async e=>{const k=i.dataset.imp,f=e.target.files[0];if(!f)return;const box=$('#imp-'+k);box.innerHTML='<p class="muted">Lendo arquivo… (planilhas grandes levam alguns segundos)</p>';
    try{await xlsxLib();const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null,raw:true});if(!rows.length)throw 0;IMPS[k]={rows,cols:Object.keys(rows[0])};mapaImp(k)}catch(x){box.innerHTML='<p style="color:var(--ruim)">Não consegui ler esse arquivo.</p>'}});
  $('#b-rec').onclick=async()=>{$('#rec-st').textContent='Recalculando…';const r=await rpc('crm_recalcular',{p_token:TOK}).catch(()=>({}));$('#rec-st').textContent=r.ok?`Pronto: ${r.lojas} lojas.`:'Falhou, tente de novo.';if(r.ok)recarregar()};
}
function xlsxLib(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const norm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function mapaImp(k){const I=IMPS[k],T=TIPOS_IMP[k],box=$('#imp-'+k);
  const usado=new Set();const guess=re=>{const c=I.cols.find(c=>re.test(norm(c))&&!usado.has(c));if(c)usado.add(c);return c||''};
  const G={};T.cols.forEach(([id,,re])=>G[id]=guess(re));
  box.innerHTML=`<p class="muted" style="margin:12px 0">${I.rows.length.toLocaleString('pt-BR')} linhas. Confira as colunas:</p><div class="campos">${T.cols.map(([id,lbl,,ob])=>`<label>${lbl}${ob?'':' <span class="muted">(opcional)</span>'}<select data-c="${id}"><option value="">${ob?'— escolha —':'— não tem —'}</option>${I.cols.map(c=>`<option ${c===G[id]?'selected':''}>${esc(c)}</option>`).join('')}</select></label>`).join('')}
    ${k==='vendas'?`<label>Unidade do volume<select data-c="un"><option value="kg">kg</option><option value="t" ${/ton/.test(norm(G.vol))?'selected':''}>toneladas</option></select></label><label>Mês para todas as linhas <span class="muted">(se não houver coluna)</span><input type="month" data-c="mesfixo"></label>`:''}</div>
    <div class="tab-scroll" style="max-height:220px;margin-top:12px" data-prev></div><button class="btn" data-go style="margin-top:12px">Importar</button> <span class="muted" data-st></span>`;
  const sel=id=>box.querySelector(`[data-c="${id}"]`)?.value||'';
  const conv=()=>I.rows.map(r=>{const lr=String(r[sel('loja')]??''),lj=lr.match(/^\s*(\d+)/);const o={loja:lj?lj[1]:null,nome:lr};
    if(k==='vendas'){let v=sel('vol')?numBR(r[sel('vol')]):null;if(v!=null&&sel('un')==='t')v=v*1000;Object.assign(o,{mes:sel('mes')?mesDe(r[sel('mes')]):(sel('mesfixo')?sel('mesfixo')+'-01':null),valor:sel('valor')?numBR(r[sel('valor')]):null,volume_kg:v,categoria:sel('categoria')?String(r[sel('categoria')]??'').trim():'',sku:sel('sku')?String(r[sel('sku')]??'').trim():''})}
    else Object.assign(o,{data:diaDe(r[sel('data')]),categoria:sel('categoria')?String(r[sel('categoria')]??'').trim():'',unidades:numBR(r[sel('unidades')]),grade:sel('grade')?numBR(r[sel('grade')]):null});return o});
  const ok=o=>o.loja&&(k==='vendas'?o.mes:o.data&&o.unidades!=null);
  const prev=()=>{const L=conv(),v=L.filter(ok);box.querySelector('[data-prev]').innerHTML=`<table><thead><tr><th>Loja</th>${k==='vendas'?'<th>Mês</th><th>Categoria</th><th class="num">Valor</th><th class="num">Volume (kg)</th>':'<th>Data</th><th>Categoria</th><th class="num">Unidades</th><th class="num">Grade</th>'}</tr></thead><tbody>${L.slice(0,8).map(o=>`<tr><td>${o.loja||'<span style="color:var(--ruim)">?</span>'}</td>${k==='vendas'?`<td>${o.mes?mesBR(o.mes):'?'}</td><td>${esc(catNome(o.categoria))}</td><td class="num">${brl(o.valor)}</td><td class="num">${nf(o.volume_kg)}</td>`:`<td>${o.data?dataBR(o.data):'?'}</td><td>${esc(catNome(o.categoria))}</td><td class="num">${nf(o.unidades)}</td><td class="num">${o.grade??'—'}</td>`}</tr>`).join('')}</tbody></table>`;box.querySelector('[data-st]').textContent=`${v.length.toLocaleString('pt-BR')} linhas válidas${L.length-v.length?' · '+(L.length-v.length)+' ignoradas':''}`};
  box.querySelectorAll('[data-c]').forEach(x=>x.onchange=prev);prev();
  box.querySelector('[data-go]').onclick=async()=>{const L=conv().filter(ok),b=box.querySelector('[data-go]'),st=box.querySelector('[data-st]');if(!L.length){toast('Nenhuma linha válida.');return}
    b.disabled=true;let tot=0,novas=0;const N=2000;
    try{for(let i=0;i<L.length;i+=N){st.textContent=`Enviando ${Math.min(i+N,L.length).toLocaleString('pt-BR')} de ${L.length.toLocaleString('pt-BR')}…`;
        const r=await rpc(T.rpc,{p_token:TOK,p_linhas:L.slice(i,i+N).map(({nome,...o})=>({...o,nome:nome.slice(0,90)}))});if(!r.ok)throw 0;tot+=r.gravadas;novas+=r.lojas_novas||0}
      st.textContent='Atualizando diagnósticos…';await rpc('crm_recalcular',{p_token:TOK});
      st.innerHTML=`<b style="color:var(--ok)">Pronto: ${tot.toLocaleString('pt-BR')} registros gravados.</b>${novas?` ${novas} loja(s) nova(s) criada(s): confira em Mapa da carteira.`:''}`;toast('Importação concluída.');await recarregar();
    }catch(e){st.textContent='Parou por falha de conexão. Pode importar o mesmo arquivo de novo: não duplica.'}b.disabled=false};
}
function numBR(v){if(v==null||v==='')return null;if(typeof v==='number')return v;let s=String(v).replace(/[R$\s]/g,'');if(/,\d{1,3}$/.test(s)||(s.includes(',')&&s.includes('.')&&s.lastIndexOf(',')>s.lastIndexOf('.')))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const n=parseFloat(s);return isNaN(n)?null:n}
function diaDe(v){if(v==null||v==='')return null;if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return null}
function mesDe(v){const d=diaDe(v);if(d)return d.slice(0,8)+'01';if(v==null)return null;const s=String(v).trim();let m;if(m=s.match(/^(\d{4})[-\/](\d{1,2})$/))return m[1]+'-'+m[2].padStart(2,'0')+'-01';if(m=s.match(/^(\d{1,2})[-\/](\d{4})$/))return m[2]+'-'+m[1].padStart(2,'0')+'-01';
  const ms={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};if(m=norm(s).match(/(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*[\s\/\-.]*(\d{2,4})/)){let y=+m[2];if(y<100)y+=2000;return y+'-'+String(ms[m[1]]).padStart(2,'0')+'-01'}return null}

carregar();
</script>
