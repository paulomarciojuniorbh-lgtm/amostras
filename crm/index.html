<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hélice CRM · Execução de contrato</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1730">
<link rel="icon" href="../marca/helice-simbolo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Ferramenta de trabalho: denso no computador, uma coluna e botões grandes no celular do promotor */
:root{
  --fundo:#f3f5fa; --card:#fff; --texto:#0f1730; --suave:#5b6687; --fraco:#8b94b0; --linha:#e2e7f2; --hover:#f7f9fd;
  --azul:#3366f0; --azul-bg:#eaf0ff; --escuro:#0f1730;
  --ok:#1a9560; --ok-bg:#e6f6ee; --med:#c27a00; --med-bg:#fff3df; --ruim:#d1453b; --ruim-bg:#fdeceb;
  --f:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--fundo);color:var(--texto);font:400 14.5px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul)}
.w{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{background:var(--escuro);color:#fff;padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:30}
.top{display:flex;align-items:center;gap:14px;height:56px}
.top .marca{display:flex;align-items:center;gap:8px;font-weight:700}
.top .marca img{width:22px;height:22px;filter:brightness(0) invert(1)}
.top .marca span{color:#8fa0d0;font-weight:500}
.top nav{display:flex;gap:4px;margin-left:18px;overflow-x:auto;scrollbar-width:none}
.top nav button{background:none;border:0;color:#b8c3e6;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:500}
.top nav button[aria-current=page]{background:rgba(255,255,255,.12);color:#fff}
.top .eu{margin-left:auto;text-align:right;font-size:12.5px;color:#b8c3e6;line-height:1.25;white-space:nowrap}
.top .eu b{display:block;color:#fff;font-size:13.5px}
@media (max-width:720px){.top{height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:0}.top nav{order:3;width:100%;margin:6px 0 0;padding-bottom:8px}.top .eu{font-size:11.5px}}
main{padding:22px 0 90px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.015em}
h2{font-size:16px;margin:0 0 12px;letter-spacing:-.01em}
.sub{color:var(--suave);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:18px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--suave)}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;font-weight:500;color:var(--fraco);padding:8px;border-bottom:1px solid var(--linha);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:10px 8px;border-bottom:1px solid var(--linha);vertical-align:middle}
tbody tr.clic{cursor:pointer}tbody tr.clic:hover{background:var(--hover)}
.num{text-align:right}
.tab-scroll{overflow:auto;max-height:70vh}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-med{background:var(--med-bg);color:var(--med)}.p-ruim{background:var(--ruim-bg);color:var(--ruim)}.p-nd{background:#eef1f7;color:var(--fraco)}.p-az{background:var(--azul-bg);color:var(--azul)}
.muted{color:var(--fraco);font-size:12.5px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros input,.filtros select{border:1px solid var(--linha);background:var(--card);border-radius:10px;padding:9px 12px;min-width:0}
.filtros input{flex:1 1 220px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--azul);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none;justify-content:center}
.btn.sec{background:var(--azul-bg);color:var(--azul)}
.btn.zap{background:#25d366;color:#06331b}
.btn.peq{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.barras{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.barras div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.barras i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--azul)}
.barras small{font-size:10.5px;color:var(--fraco);white-space:nowrap}
.barras em{font-style:normal;font-size:11px;font-weight:600}
.vazio{text-align:center;color:var(--suave);padding:28px 10px}
.vazio b{display:block;color:var(--texto);font-size:15px;margin-bottom:4px}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,48,.45);display:flex;justify-content:flex-end}
.painel{background:var(--fundo);width:min(980px,100%);height:100%;overflow:auto;padding:0 0 40px;box-shadow:-20px 0 50px rgba(0,0,0,.15)}
.painel .cab{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--linha);padding:14px 18px;display:flex;align-items:center;gap:12px;z-index:2}
.painel .cab h1{font-size:18px;margin:0}
.painel .cab .fechar{margin-left:auto;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--suave);padding:4px 8px}
.painel .corpo{padding:16px 18px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campos label{display:grid;gap:4px;font-size:12.5px;color:var(--suave);min-width:0}
.campos .full{grid-column:1/-1}
.campos input,.campos select,.campos textarea{width:100%;min-width:0;border:1px solid var(--linha);border-radius:10px;padding:9px 11px;background:var(--card);font-size:14.5px;color:var(--texto)}
@media (max-width:560px){.campos{grid-template-columns:1fr}}
/* checklist */
.grupo{margin:18px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.item{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:14px;margin-bottom:10px}
.item .l1{display:flex;align-items:flex-start;gap:12px}
.item .l1 div{flex:1}
.item b{display:block;font-weight:600}
.item small{color:var(--suave);font-size:12.5px}
.item .ctrl{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.step{display:flex;align-items:center;border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.step button{width:46px;height:46px;border:0;background:var(--hover);font-size:22px;cursor:pointer}
.step output{min-width:54px;text-align:center;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sn{display:flex;border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.sn button{padding:12px 20px;border:0;background:var(--card);font-weight:600;cursor:pointer;min-width:72px}
.sn button[aria-pressed=true][data-met]{background:var(--escuro);color:#fff}
.sn button[aria-pressed=true].sim{background:var(--ok);color:#fff}
.sn button[aria-pressed=true].nao{background:var(--ruim);color:#fff}
.pctin{display:flex;align-items:center;gap:6px}
.pctin input{width:90px;border:1px solid var(--linha);border-radius:12px;padding:11px;font-size:18px;font-weight:600;text-align:center}
.foto{margin-left:auto;display:flex;align-items:center;gap:8px}
.foto label{display:inline-flex;align-items:center;gap:6px;padding:10px 12px;border-radius:10px;background:var(--azul-bg);color:var(--azul);font-weight:600;font-size:13px;cursor:pointer}
.foto img{width:46px;height:46px;border-radius:8px;object-fit:cover}
.meta-tag{font-size:12px;font-weight:600;color:var(--suave);background:#eef1f7;border-radius:6px;padding:2px 7px;margin-left:6px}
.barra-fixa{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--linha);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:3}
.barra-fixa .pctg{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.minhas .loja{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.minhas .loja div{flex:1}
.minhas .loja b{display:block;font-size:15.5px}
.hist{border-top:1px solid var(--linha);padding:12px 0}
.hist .fotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hist .fotos a img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.meta-in{width:70px;border:1px solid var(--linha);border-radius:8px;padding:5px 7px;text-align:right}
.lista-sel{max-height:46vh;overflow:auto;border:1px solid var(--linha);border-radius:12px;background:var(--card)}
.lista-sel label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--linha);cursor:pointer}
.lista-sel label:hover{background:var(--hover)}
.grid2>*,.card,.kpi{min-width:0}
.painel .corpo,.painel .corpo>*{min-width:0;max-width:100%}.painel{overflow-x:hidden}
@media (max-width:720px){
 .tc thead{display:none}.tc,.tc tbody{display:block;width:100%}
 .tc tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:12px 2px;border-bottom:1px solid var(--linha)}
 .tc td{display:block;border:0;padding:0;text-align:left!important}
 .tc td:first-child{flex:1 1 100%}
 .tc td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--fraco);font-weight:400}
 .tab-scroll{max-height:none!important;overflow:visible}
 .kpis{grid-template-columns:1fr 1fr!important;gap:8px}.kpi{padding:12px}.kpi b{font-size:20px}
 .card{padding:14px;border-radius:12px}.painel .corpo{padding:12px}
 .top .eu .perf{display:none}.top .marca{font-size:15px}
 h1{font-size:20px}
}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--escuro);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:90;font-weight:500}
.toast.on{opacity:1}
.gate{max-width:420px;margin:90px auto;text-align:center;padding:0 20px}
.login label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--suave)}.login input{border:1px solid var(--linha);border-radius:6px;padding:11px 12px;font-size:16px;font-weight:400;color:var(--texto)}
.ld{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:g .7s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:820px){.segs{grid-template-columns:repeat(2,1fr)}}
.segb{border:1px solid var(--linha);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.segb:hover{border-color:var(--azul)}.segb b{font-size:22px;font-variant-numeric:tabular-nums}.segb span{font-size:12.5px;color:var(--suave)}
.segb.ok b{color:var(--ok)}.segb.ruim b{color:var(--ruim)}.segb.med b{color:var(--med)}
.chips-seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.chips-seg button{white-space:nowrap;border:1px solid var(--linha);background:var(--card);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px}
.chips-seg button b{color:var(--suave);font-weight:600;margin-left:2px}
.chips-seg button[aria-pressed=true]{background:var(--escuro);color:#fff;border-color:var(--escuro)}.chips-seg button[aria-pressed=true] b{color:#b8c3e6}
.ltabs{display:flex;gap:2px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--linha);padding:0 12px;position:sticky;top:61px;z-index:2;scrollbar-width:none}
.ltabs button{border:0;background:none;padding:12px 12px;font-weight:500;color:var(--suave);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.ltabs button[aria-pressed=true]{color:var(--azul);border-bottom-color:var(--azul)}

/* ===== visual executivo ===== */
:root{--fundo:#eef1f5;--texto:#13203a;--suave:#4a5872;--fraco:#7a8599;--linha:#dbe0e8;--hover:#f4f6f9;--azul:#1e4fd6;--azul-bg:#e7edfb;--escuro:#0b1630;--cinza:#a9b3c4}
body{font-size:14px}
.card{border-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.05);padding:18px 20px}
h1{font-size:23px;font-weight:700;letter-spacing:-.02em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--suave);font-weight:600}
.pill{border-radius:4px;padding:2px 7px}
.btn{border-radius:6px}
.top nav button{border-radius:0;padding:18px 12px}
.top nav button[aria-current=page]{background:none;color:#fff;box-shadow:inset 0 -3px 0 #5d8bff}
@media (max-width:720px){.top nav button{padding:10px 12px}}
.kpi{border-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.05);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--azul)}
.kpi small{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--fraco);margin-bottom:6px}
.kpi.k-ok:before{background:var(--ok)}.kpi.k-ruim:before{background:var(--ruim)}.kpi.k-med:before{background:var(--med)}
.segb{border-radius:6px}.segb[aria-pressed=true]{border-color:var(--azul);background:var(--azul-bg);box-shadow:inset 0 0 0 1px var(--azul)}
.chips-seg button{border-radius:6px}
.barras i{border-radius:3px 3px 0 0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--fraco);font-weight:600;margin-bottom:4px}
.recorte{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--escuro);color:#fff;border-radius:8px;padding:12px 16px;margin-bottom:14px}
.recorte b{font-weight:600}.recorte .muted{color:#9fb0d6}
.recorte button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
.recorte button.prim{background:#fff;color:var(--escuro);border-color:#fff;font-weight:600}
.cmp{display:grid;gap:14px}
.cmp-l{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center}
.cmp-l>span{font-size:13px;color:var(--suave)}
.cmp-b{display:grid;gap:4px}
.cmp-b div{display:flex;align-items:center;gap:8px;font-size:12.5px;font-variant-numeric:tabular-nums}
.cmp-b i{height:10px;border-radius:2px;display:block;min-width:2px}
.cmp-b em{font-style:normal;font-weight:600;white-space:nowrap}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--suave);margin-bottom:14px}
.legenda span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.insight{border-left:3px solid var(--azul);background:var(--azul-bg);padding:10px 14px;border-radius:0 6px 6px 0;margin-top:16px;font-size:13.5px}
.g11{grid-template-columns:1fr 1fr}@media (max-width:900px){.g11{grid-template-columns:1fr}}
@media (max-width:640px){.cmp-l{grid-template-columns:1fr;gap:4px}.recorte{padding:12px}}
</style>
</head>
<body>
<header><div class="w top">
  <div class="marca"><img src="../marca/helice-simbolo.svg" alt="">Hélice <span>CRM</span></div>
  <nav id="nav" hidden></nav>
  <div class="eu" id="eu"></div>
</div></header>
<main class="w" id="app"><p class="sub" style="text-align:center;margin-top:60px">Carregando…</p></main>
<div class="modal" id="modal" hidden><div class="painel" id="painel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<script>
const SB='https://ryhyvzwqtktaaonznizn.supabase.co',KEY='sb_publishable_Ji31DC1ihqZTR7gmLeYTLw_GHgBjWN0';
const $=s=>document.querySelector(s), esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rpc=(f,b)=>fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const pub=p=>SB+'/storage/v1/object/public/crm/'+p;
/* no celular as tabelas viram cartões: cada célula ganha o rótulo da coluna */
function rotular(){document.querySelectorAll('.rolafim:not([data-r])').forEach(e=>{e.scrollLeft=e.scrollWidth;e.dataset.r=1});document.querySelectorAll('table.tc:not([data-rot])').forEach(t=>{const H=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());if(H.length)t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(i&&H[i]&&!td.dataset.l)td.dataset.l=H[i]}));t.dataset.rot=1})}
new MutationObserver(()=>{cancelAnimationFrame(rotular._r);rotular._r=requestAnimationFrame(rotular)}).observe(document.body,{childList:true,subtree:true});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
const FORM={atacarejo:'Atacarejo',varejo:'Varejo',conveniencia:'Conveniência',mais_fraldas:'Mais Fraldas',farma:'Farma',atacado:'Atacado'};
const PERF={exec:'Executivo de contas',coord:'Coordenador',promotor:'Promotor',ga:'Gerente de Área (GA)',gr:'Gerente Regional Nordeste'};
const GERENTE=p=>p==='ga'||p==='gr';
const pctPill=p=>p==null?'<span class="pill p-nd">sem checagem</span>':`<span class="pill ${p>=90?'p-ok':p>=70?'p-med':'p-ruim'}">${String(p).replace('.',',')}%</span>`;
const dataBR=s=>s?new Date(s+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'—';
const telZap=t=>{let d=String(t||'').replace(/\D/g,'');if(!d)return null;if(d.length<=11)d='55'+d;return d};

/* token: chega por #t=..., fica guardado no aparelho */
let TOK=null;try{TOK=localStorage.getItem('helice_crm_tok')}catch(e){}
const mt=location.hash.match(/t=([a-f0-9]{20,})/);if(mt){TOK=mt[1];try{localStorage.setItem('helice_crm_tok',TOK)}catch(e){}history.replaceState(null,'',location.pathname)}
let D=null,aba='painel',HASH=null;
async function hashTok(){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(TOK));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

async function carregar(){
  if(!TOK){gate();return}
  try{D=await rpc('crm_painel',{p_token:TOK})}catch(e){$('#app').innerHTML='<div class="gate"><h1>Sem conexão</h1><p class="sub">Confira a internet e tente de novo.</p><button class="btn" onclick="location.reload()">Tentar de novo</button></div>';return}
  if(!D.ok){try{localStorage.removeItem('helice_crm_tok')}catch(e){}TOK=null;gate('Entre com seu usuário e senha. Se ainda não tem, peça ao seu executivo de contas.');return}
  rpc('crm_registrar_acesso',{p_token:TOK,p_ua:navigator.userAgent.slice(0,200)}).catch(()=>{});
  D.P=Object.fromEntries(D.pessoas.map(p=>[p.id,p]));D.PT=Object.fromEntries(D.pontos.map(p=>[p.id,p]));
  if(D.eu.perfil!=='promotor')await carregarVis();
  $('#eu').innerHTML=`<b>${esc(D.eu.nome)}</b><span class="perf">${PERF[D.eu.perfil]} · </span><a href="#" id="minha-senha" style="color:#b8c3e6">senha</a> · <a href="#" id="sair" style="color:#b8c3e6">sair</a>`;

    <div class="foto"><img hidden alt=""><label>📷 Foto<input type="file" accept="image/*" capture="environment" hidden></label></div></div></div>`).join('')}`).join('')}
  <label class="campos" style="display:grid;margin-top:16px"><span class="muted">Observação (opcional)</span><textarea id="c-obs" rows="2" placeholder="Ex.: gerente pediu mais produto para a ilha" style="border:1px solid var(--linha);border-radius:10px;padding:10px"></textarea></label></div>

  const atual=()=>{const r=metas.map(m=>ratio(V[m.ponto_id],m.meta)).filter(x=>x!=null);const falta=metas.filter(m=>V[m.ponto_id]==null).length;$('#c-pct').textContent=r.length?String(Math.round(r.reduce((a,b)=>a+b,0)/r.length*1000)/10).replace('.',',')+'%':'–';$('#c-pct').style.color=!r.length?'':r.reduce((a,b)=>a+b,0)/r.length>=.9?'var(--ok)':r.reduce((a,b)=>a+b,0)/r.length>=.7?'var(--med)':'var(--ruim)';$('#c-falta').textContent=falta?falta+' item(ns) sem resposta':'tudo respondido'};
  document.querySelectorAll('.item').forEach(el=>{const id=+el.dataset.i;
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{V[id]=Math.max(0,(V[id]??0)+(+b.dataset.d));el.querySelector('output').textContent=V[id];atual()});
    el.querySelectorAll('.sn button').forEach(b=>b.onclick=()=>{V[id]=b.classList.contains('sim')?1:0;el.querySelectorAll('.sn button').forEach(x=>x.setAttribute('aria-pressed',x===b));atual()});
    const pi=el.querySelector('.pctin input');if(pi)pi.oninput=()=>{V[id]=pi.value===''?null:Math.max(0,Math.min(100,+pi.value));atual()};
    el.querySelector('input[type=file]').onchange=e=>{const f=e.target.files[0];if(!f)return;F[id]=f;const im=el.querySelector('.foto img');im.src=URL.createObjectURL(f);im.hidden=false};
  });atual();
  $('#c-env').onclick=async()=>{
    const b=$('#c-env');if(!metas.some(m=>V[m.ponto_id]!=null)){toast('Responda pelo menos um item.');return}
    b.disabled=true;b.innerHTML='<span class="ld"></span> Enviando';

      if(Object.keys(F).length&&!HASH)HASH=await hashTok();

        if(F[m.ponto_id]){const blob=await reduzir(F[m.ponto_id]);const path=`${HASH}/${l.id}/${Date.now()}-${m.ponto_id}.jpg`;

        itens.push({ponto_id:m.ponto_id,valor:V[m.ponto_id],foto})}
      const r=await rpc('crm_salvar_checagem',{p_token:TOK,p_loja:l.id,p_itens:itens,p_obs:$('#c-obs').value.trim()||null});

  };
}
function reduzir(f){return new Promise(res=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b||f),'image/jpeg',.8)};img.onerror=()=>res(f);img.src=URL.createObjectURL(f)})}

}

/* ---------- estoque por produto ---------- */
let SKF='ruptura',SKR=null;
const SKG={ruptura:['Ruptura do mix',x=>x.m&&(+x.e||0)<=0,'Produto do mix ativo sem estoque na loja.'],parado:['Parados',x=>(+x.e||0)>0&&!(+x.v),'Têm estoque e não venderam nada em 30 dias.'],excesso:['Excesso',x=>(+x.e||0)>0&&(+x.v)>0&&(+x.d||0)>60,'Estoque para mais de 60 dias.'],negativo:['Negativos',x=>(+x.e||0)<0,'Estoque negativo: ajuste de inventário a cobrar.'],todos:['Todos',()=>true,'']};
function blocoProdutos(R){SKR=R;const S=R.skus||[];if(!S.length)return '<div class="card"><h2>Produtos</h2><div class="vazio">Ainda não há leitura por produto para esta loja. Ela aparece quando a base semanal "Estoque por produto" for importada.</div></div>';
  const g=SKG[SKF],L=S.filter(g[1]).sort((a,b)=>SKF==='parado'?(+b.i||0)-(+a.i||0):SKF==='excesso'?(+b.d||0)-(+a.d||0):(a.c||'').localeCompare(b.c||'')||(a.p||'').localeCompare(b.p||''));
  const n=k=>S.filter(SKG[k][1]).length,mix=S.filter(x=>x.m).length,novaR=x=>SKG.ruptura[1](x)&&x.ant&&(+x.ea||0)>0,saiuR=x=>x.m&&(+x.e||0)>0&&x.ant&&(+x.ea||0)<=0;
  const voltaram=S.filter(saiuR).length,entraram=S.filter(novaR).length;
  return `<div class="card" id="skb"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Produtos · leitura de ${dataBR(R.sku_data)}</h2><span class="muted">${mix} no mix ativo · ${S.length} itens</span></div>
  <div class="legenda" style="margin:10px 0 12px">${entraram?`<span style="--c:var(--ruim)">${entraram} entraram em ruptura na semana</span>`:''}${voltaram?`<span style="--c:var(--ok)">${voltaram} voltaram a ter estoque</span>`:''}</div>
  <div class="chips-seg" style="margin-bottom:10px">${['ruptura','parado','excesso','negativo','todos'].map(k=>`<button type="button" data-skf="${k}" aria-pressed="${SKF===k}">${SKG[k][0]} <b>${k==='todos'?S.length:n(k)}</b></button>`).join('')}</div>
  ${g[2]?`<p class="muted" style="margin:0 0 8px">${g[2]}</p>`:''}
  ${L.length?`<div class="tab-scroll" style="max-height:460px"><table class="tc"><thead><tr><th>Produto</th><th class="num">Estoque</th><th class="num">Sem. anterior</th><th class="num">Venda 30d</th><th class="num">DDE</th><th class="num">Dias desde a entrada</th></tr></thead><tbody>${L.slice(0,300).map(x=>`<tr><td>${esc(x.p)}${novaR(x)?' <span class="pill p-ruim">nova ruptura</span>':saiuR(x)?' <span class="pill p-ok">voltou</span>':''}${x.m?'':' <span class="pill p-nd">fora do mix</span>'}<div class="muted">${esc(catNome(x.c))}</div></td><td class="num" style="${(+x.e||0)<=0?'color:var(--ruim);font-weight:600':''}">${nf(x.e)}</td><td class="num muted">${x.ant?nf(x.ea):'—'}</td><td class="num">${nf(x.v)}</td><td class="num">${x.d==null||!(+x.v)?'—':Math.round(x.d)}</td><td class="num">${x.i==null?'—':Math.round(x.i)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="vazio">Nenhum produto nesse grupo. 👍</div>'}
  ${SKF!=='todos'&&L.length?`<div style="margin-top:12px"><button class="btn sec peq" data-skcopy>Copiar lista para WhatsApp</button></div>`:''}</div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-skf]');if(b&&SKR){SKF=b.dataset.skf;const el=$('#skb');if(el)el.outerHTML=blocoProdutos(SKR);return}
  if(e.target.closest('[data-skcopy]')&&SKR){const L=(SKR.skus||[]).filter(SKG[SKF][1]);const t=`*${SKG[SKF][0]} · ${SKR.loja.nome}* (leitura ${dataBR(SKR.sku_data)})\n`+L.map(x=>`• ${x.p} — estoque ${nf(x.e)}${(+x.v)?`, vendeu ${nf(x.v)} em 30d`:''}`).join('\n');try{await navigator.clipboard.writeText(t);toast('Lista copiada.')}catch(z){prompt('Copie:',t)}}});
function rupturaPromotor(S){const L=(S||[]).filter(SKG.ruptura[1]);if(!S||!S.length)return '';return `<div class="card" style="border-left:3px solid ${L.length?'var(--ruim)':'var(--ok)'}"><h2>Produtos em falta nesta loja</h2>${L.length?`<p class="muted" style="margin:0 0 8px">Do mix ativo e sem estoque no sistema. Confira na gôndola e no depósito e avise o gerente.</p><ul style="margin:0;padding-left:18px">${L.slice(0,40).map(x=>`<li>${esc(x.p)}</li>`).join('')}</ul>${L.length>40?`<p class="muted">+ ${L.length-40} produtos</p>`:''}`:'<p style="margin:0">Nenhum produto do mix em falta na última leitura. 👍</p>'}</div>`}

/* ---------- ficha 360 da loja ---------- */
async function abrirLoja(id,abaL){
  abrir(`<div class="cab"><h1>Carregando…</h1><button class="fechar" aria-label="Fechar">×</button></div>`);
  let R;try{R=await rpc('crm_loja',{p_token:TOK,p_loja:id})}catch(e){toast('Sem conexão.');return}
  if(!R.ok){toast('Sem acesso a esta loja.');fechar();return}
  const l=R.loja,ex=D.eu.perfil==='exec',r=R.resumo||{},LS=D.lojas.find(x=>x.id===l.id)||{};
  const metas=R.metas.map(m=>({...m,p:D.PT[m.ponto_id]})).sort((a,b)=>a.p.ordem-b.p.ordem);
  const ultC=R.checagens[0];
  const tabs=[['geral','Visão geral'],['vendas','Vendas'],['estoque','Estoque'],['contrato','Contrato'],['notas','Anotações'+(R.notas.filter(n=>!n.feito&&n.proxima_acao).length?' •':'')],['dados','Dados e equipe']];
  let at=abaL||'geral';
  const chips=`${l.promotor_id?`<span class="pill p-az">Promotor: ${esc(D.P[l.promotor_id]?.nome||'')}</span>`:'<span class="pill p-nd">Sem promotor</span>'}${l.promotor_marca?` <span class="pill p-az">Promotor de marca${l.promotor_marca_obs?': '+esc(l.promotor_marca_obs):''}</span>`:''} ${diagPill(r.diag)} ${ultC?pctPill(ultC.pct):'<span class="pill p-nd">sem checagem</span>'}${visPill(l.id)}`;
  const corpo={
   geral:()=>`<div style="margin-bottom:12px">${chips}</div>
     ${r.diag?`<div class="card" style="border-left:4px solid ${r.diag==='crescendo'?'var(--ok)':r.diag==='queda_estoque'?'var(--ruim)':r.diag?.startsWith('queda')?'var(--med)':'var(--linha)'}"><b>Diagnóstico:</b> ${esc(DIAG[r.diag]?.[2]||'')}</div>`:''}
     <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><b style="font-size:20px">${brl(r.ytd)}</b><span>vendas no ano ${varPill(var_(r.ytd,r.ytd_ant))}</span></div>
      <div class="kpi"><b style="font-size:20px">${brl(r.m3)}</b><span>últimos 3 meses ${varPill(var_(r.m3,r.m3_ant))}</span></div>
      <div class="kpi"><b style="font-size:20px">${ton(r.ton_ytd)}</b><span>volume no ano ${varPill(var_(r.ton_ytd,r.ton_ytd_ant))}</span></div>
      <div class="kpi"><b style="font-size:20px">${nf(r.est_ult)} un</b><span>estoque ${varPill(var_(r.est_ult,r.est_ant))} em 4 sem</span></div>
      <div class="kpi"><b style="font-size:20px">${r.grade_ult??'—'} SKUs</b><span>grade ${r.grade_ant!=null&&r.grade_ult!=null?(r.grade_ult-r.grade_ant>0?'+':'')+(r.grade_ult-r.grade_ant)+' em 4 sem':''}</span></div>
      <div class="kpi"><b style="font-size:20px">${ultC?String(ultC.pct).replace('.',',')+'%':'—'}</b><span>contrato ${ultC?'em '+dataBR(ultC.semana):'(nunca checado)'}</span></div></div>
     ${(r.cats_neg||0)+(r.cats_zero||0)?`<div class="card" style="background:var(--ruim-bg);border-color:#f5c6c2"><b>⚠ ${(r.cats_neg||0)+(r.cats_zero||0)} categoria(s) com estoque zerado ou negativo</b> na última leitura. Veja a aba Estoque.</div>`:''}
     <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><button class="btn" data-go="nota">+ Registrar visita / anotação</button><button class="btn sec" id="b-check" ${metas.length?'':'disabled'}>✓ Fazer checagem</button>${l.gerente_tel?`<a class="btn zap" href="https://wa.me/${telZap(l.gerente_tel)}" target="_blank" rel="noopener">WhatsApp do gerente</a>`:''}</div>
     ${R.notas.length?`<div class="card"><h2>Últimas anotações</h2>${R.notas.slice(0,3).map(nota).join('')}</div>`:''}`,
   vendas:()=>R.vendas.length?`<div class="card"><h2>Vendas mês a mês</h2>${graficoVendas(R.vendas)}</div>
     <div class="card"><h2>Por categoria · ano até ${mesBR(R.ult_mes)}</h2><div class="tab-scroll"><table class="tc"><thead><tr><th>Categoria</th><th class="num">R$ no ano</th><th class="num">Ano anterior</th><th class="num">Var.</th><th class="num">Volume</th><th class="num">Var. vol.</th></tr></thead><tbody>${R.categorias.map(c=>`<tr><td>${esc(catNome(c.categoria))}</td><td class="num">${brl(c.valor)}</td><td class="num muted">${brl(c.valor_ant)}</td><td class="num">${varPill(var_(c.valor,c.valor_ant))}</td><td class="num">${ton(c.kg)}</td><td class="num">${varPill(var_(c.kg,c.kg_ant))}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="card vazio"><b>Sem vendas carregadas para esta loja</b></div>',
   estoque:()=>blocoProdutos(R)+(R.estoque.length?`<div class="card"><h2>Estoque por categoria (unidades) · fechamento de cada mês</h2>${graficoEstoque(R.est_mes)}</div>
     <div class="card"><h2>Por categoria · ${dataBR(R.est_data)} × ${dataBR(R.est_ant_data)}</h2><div class="tab-scroll"><table class="tc"><thead><tr><th>Categoria</th><th class="num">Estoque</th><th class="num">4 sem antes</th><th class="num">Var.</th><th class="num">Grade</th><th class="num">Antes</th></tr></thead><tbody>${R.estoque.map(e=>`<tr><td>${esc(catNome(e.categoria))}${e.unidades<0?' <span class="pill p-ruim">negativo</span>':e.unidades==0&&e.grade>0?' <span class="pill p-ruim">zerado</span>':''}</td><td class="num">${nf(e.unidades)}</td><td class="num muted">${nf(e.unidades_ant)}</td><td class="num">${e.unidades>0&&e.unidades_ant>0?varPill(var_(e.unidades,e.unidades_ant)):'<span class="muted">—</span>'}</td><td class="num">${e.grade??'—'}</td><td class="num ${e.grade!==e.grade_ant&&e.grade_ant!=null?'':'muted'}">${e.grade_ant??'—'}${e.grade_ant!=null&&e.grade!=null&&e.grade!==e.grade_ant?` <span class="pill ${e.grade>e.grade_ant?'p-ok':'p-ruim'}">${e.grade>e.grade_ant?'+':''}${e.grade-e.grade_ant}</span>`:''}</td></tr>`).join('')}</tbody></table></div>
     <p class="muted" style="margin:10px 0 0">Estoque negativo costuma ser venda registrada antes da entrada da nota: trate como ruptura provável.</p></div>`:'<div class="card vazio"><b>Sem estoque carregado para esta loja</b></div>'),
   contrato:()=>`<div style="margin-bottom:12px"><button class="btn" id="b-check" ${metas.length?'':'disabled'}>✓ Fazer checagem</button></div>
     <div class="card"><h2>Pontos do contrato</h2>${metas.length?`<table class="tc"><thead><tr><th>Ponto</th><th class="num">Meta</th><th class="num">Última checagem</th></tr></thead><tbody>${metas.map(m=>`<tr><td>${esc(m.p.nome)}${m.p.periodicidade==='mensal'?' <span class="meta-tag">mensal</span>':''}${m.meta!=m.padrao&&m.padrao!=null?'<div class="muted">padrão do contrato: '+m.padrao+'</div>':''}</td><td class="num">${ex&&m.p.tipo!=='simnao'?`<input class="meta-in" type="number" min="0" value="${m.meta}" data-meta="${m.ponto_id}" aria-label="Meta">`:(m.p.tipo==='pct'?m.meta+'%':m.p.tipo==='simnao'?'Sim':m.meta)}</td><td class="num">${m.ultimo==null?'<span class="muted">—</span>':`<span class="pill ${ratio(m.ultimo,m.meta)>=1?'p-ok':ratio(m.ultimo,m.meta)>=.7?'p-med':'p-ruim'}">${m.p.tipo==='simnao'?(m.ultimo>=1?'Sim':'Não'):m.ultimo+(m.p.tipo==='pct'?'%':'')}</span>`}</td></tr>`).join('')}</tbody></table>`:'<div class="vazio">Sem pontos de contrato para este formato.</div>'}</div>
     <div class="card"><h2>Histórico de checagens</h2>${R.checagens.length?R.checagens.map(c=>`<div class="hist"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>Semana de ${dataBR(c.semana)}</b><div class="muted">${esc(c.quem||'')}</div></div>${pctPill(c.pct)}</div>${c.obs?`<p style="margin:6px 0 0">${esc(c.obs)}</p>`:''}<div class="fotos">${(c.itens||[]).filter(i=>i.foto).map(i=>`<a href="${pub(i.foto)}" target="_blank" rel="noopener" title="${esc(D.PT[i.ponto_id]?.nome)}"><img src="${pub(i.foto)}" alt="${esc(D.PT[i.ponto_id]?.nome)}" loading="lazy"></a>`).join('')}</div></div>`).join(''):'<div class="vazio">Nenhuma checagem ainda.</div>'}</div>`,
   notas:()=>`<div class="card"><h2>Nova anotação</h2><div class="campos">
     <label>Tipo<select id="n-t"><option value="visita">Visita</option><option value="ligacao">Ligação</option><option value="negociacao">Negociação</option><option value="nota">Anotação</option></select></label><label>&nbsp;<span></span></label>
     <label class="full">O que aconteceu<textarea id="n-x" rows="3" placeholder="Ex.: gerente aceitou ilha extra de biscoito na entrada"></textarea></label>
     <label>Próxima ação (opcional)<input id="n-a" placeholder="Ex.: levar planograma novo"></label><label>Prazo<input id="n-p" type="date"></label></div>
     <button class="btn" id="n-s" style="margin-top:12px">Salvar anotação</button></div>
     <div class="card"><h2>Histórico</h2>${R.notas.length?R.notas.map(nota).join(''):'<div class="vazio">Nenhuma anotação ainda.</div>'}</div>`,
   dados:()=>dadosLoja(l,ex)
  };
  const draw=()=>{abrir(`<div class="cab"><div><h1>${esc(l.nome)}</h1><div class="muted">#${l.id} · ${esc(l.bandeira||'')} · ${FORM[l.formato]||''}${l.tamanho&&l.formato==='atacarejo'?' '+l.tamanho:''} · ${esc(l.cidade||'')} ${esc(l.uf||'')} · ${grupoDe(l)}</div></div><button class="fechar" aria-label="Fechar">×</button></div>
    <div class="ltabs">${tabs.map(([k,t])=>`<button data-t="${k}" aria-pressed="${k===at}">${t}</button>`).join('')}</div><div class="corpo">${corpo[at]()}</div>`);
    document.querySelectorAll('.ltabs button').forEach(b=>b.onclick=()=>{at=b.dataset.t;draw()});
    $('#b-check')&&($('#b-check').onclick=()=>checklist(l,metas));
    document.querySelectorAll('[data-go=nota]').forEach(b=>b.onclick=()=>{at='notas';draw()});
    document.querySelectorAll('[data-feito]').forEach(b=>b.onclick=async()=>{const x=await rpc('crm_salvar_nota',{p_token:TOK,p:{id:+b.dataset.feito,feito:true}}).catch(()=>({}));if(x.ok){toast('Ação concluída.');await recarregar();abrirLoja(l.id,at)}});
    if(at==='notas')$('#n-s').onclick=async()=>{const t=$('#n-x').value.trim(),a=$('#n-a').value.trim();if(!t&&!a){toast('Escreva a anotação.');return}$('#n-s').disabled=true;
      const x=await rpc('crm_salvar_nota',{p_token:TOK,p:{loja:l.id,tipo:$('#n-t').value,texto:t,proxima_acao:a,prazo:$('#n-p').value}}).catch(()=>({}));
      if(x.ok){toast('Anotação salva.');await recarregar();abrirLoja(l.id,'notas')}else{toast('Não consegui salvar.');$('#n-s').disabled=false}};
    if(at==='contrato'&&ex)document.querySelectorAll('[data-meta]').forEach(i=>i.onchange=async()=>{const v=i.value===''?null:+i.value;const x=await rpc('crm_salvar_meta',{p_token:TOK,p_loja:l.id,p_ponto:+i.dataset.meta,p_meta:v}).catch(()=>({}));toast(x.ok?'Meta atualizada.':'Não consegui salvar.')});
    if(at==='dados'&&ex)ligarDados(l);
  };draw();
}
const TIPO={visita:'🚶 Visita',ligacao:'📞 Ligação',negociacao:'🤝 Negociação',nota:'📝 Anotação'};
const nota=n=>`<div class="hist"><div style="display:flex;justify-content:space-between;gap:10px"><b>${TIPO[n.tipo]||n.tipo}</b><span class="muted">${new Date(n.criado_em).toLocaleDateString('pt-BR')}${n.quem?' · '+esc(n.quem):''}</span></div>${n.texto?`<p style="margin:6px 0 0;white-space:pre-wrap">${esc(n.texto)}</p>`:''}${n.proxima_acao?`<div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="pill ${n.feito?'p-ok':n.prazo&&n.prazo<D.hoje?'p-ruim':'p-med'}">${n.feito?'✓ feito':'próxima ação'}</span> ${esc(n.proxima_acao)}${n.prazo?' <span class="muted">até '+dataBR(n.prazo)+'</span>':''}${!n.feito?` <button class="btn sec peq" data-feito="${n.id}">Concluir</button>`:''}</div>`:''}</div>`;
let ECAT=null;const GE={};
function graficoEstoque(E,id){if(!E||!E.length)return '';id=id||'ge';GE[id]=E;
  const tot={};E.forEach(e=>tot[e.categoria]=(tot[e.categoria]||0)+Math.max(+e.unidades||0,0));const cats=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]);
  if(!ECAT||!cats.includes(ECAT))ECAT=cats[0];
  const datas=[...new Set(E.map(e=>e.data))].sort().slice(-12),P=datas.map(d=>E.find(e=>e.data===d&&e.categoria===ECAT)||{data:d,unidades:null,grade:null});
  const mx=Math.max(...P.map(s=>Math.max(+s.unidades||0,0)),1),fmt=v=>v==null?'—':Math.abs(+v)>=1000?((+v)/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':nf(v);
  return `<div class="ge" id="${id}" style="min-width:0;max-width:100%"><div class="chips-seg" style="margin-bottom:8px;display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding-bottom:4px">${cats.map(c=>`<button type="button" data-ecat="${esc(c)}" aria-pressed="${c===ECAT}">${esc(catNome(c))}</button>`).join('')}</div>
  <div class="rolafim" style="overflow-x:auto;-webkit-overflow-scrolling:touch"><div class="barras" style="height:170px;min-width:${Math.max(P.length*48,280)}px">${P.map(s=>{const neg=s.unidades!=null&&s.unidades<0,zero=s.unidades===0;return `<div title="Leitura de ${dataBR(s.data)}: ${s.unidades==null?'sem leitura':nf(s.unidades)+' un'}${s.grade!=null?' · grade '+s.grade:''}"><em style="${neg||zero?'color:var(--ruim)':''}">${fmt(s.unidades)}</em><i style="height:${neg||zero||s.unidades==null?3:Math.max(3,s.unidades/mx*100)}%;background:${neg||zero?'var(--ruim)':'#5b8def'};max-width:34px"></i><small>${mesBR(s.data)}</small></div>`}).join('')}</div></div>
  <p class="muted" style="margin:6px 0 0">Estoque de <b>${esc(catNome(ECAT))}</b> na última leitura de cada mês (não é soma das semanas). Vermelho: zerado ou negativo.</p></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ecat]');if(!b)return;ECAT=b.dataset.ecat;document.querySelectorAll('.ge').forEach(g=>{g.outerHTML=graficoEstoque(GE[g.id],g.id)})});
function dadosLoja(l,ex){const proms=D.pessoas.filter(p=>p.perfil==='promotor'),coords=D.pessoas.filter(p=>p.perfil==='coord'),d=ex?'':'disabled';
  return `<div class="card"><h2>Dados e equipe da loja</h2><div class="campos">
    <label>Cidade<input id="l-ci" value="${esc(l.cidade||'')}" ${d}></label><label>UF<input id="l-uf" value="${esc(l.uf||'')}" maxlength="2" style="text-transform:uppercase" ${d}></label>
    <label>Gerente da loja<input id="l-gn" value="${esc(l.gerente_nome||'')}" ${d}></label><label>Telefone do gerente<input id="l-gt" value="${esc(l.gerente_tel||'')}" inputmode="tel" ${d}></label>
    <label>Aniversário do gerente<input id="l-gd" type="date" value="${l.gerente_nasc||''}" ${d}></label><label>&nbsp;</label>
    <label>Promotor<select id="l-pr" ${d}><option value="">Sem promotor</option>${proms.map(p=>`<option value="${p.id}" ${l.promotor_id===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></label>
    <label>Coordenador<select id="l-co" ${d}><option value="">—</option>${coords.map(p=>`<option value="${p.id}" ${l.coord_id===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></label>
    <label style="align-content:end"><span style="display:flex;align-items:center;gap:8px;padding:10px 0;color:var(--texto);font-size:14.5px"><input type="checkbox" id="l-pm" ${l.promotor_marca?'checked':''} ${d} style="width:18px;height:18px">Tem promotor de marca</span></label>
    <label>Promotor de marca: quem / qual marca<input id="l-pmo" value="${esc(l.promotor_marca_obs||'')}" ${d}></label>
    <label>Tamanho${l.tamanho_proposta&&l.tamanho_proposta!==l.tamanho?` <span class="muted">(proposta trade: ${esc(l.tamanho_proposta)})</span>`:''}<select id="l-tm" ${d}>${['','P','M','G'].map(t=>`<option ${l.tamanho===t||(!l.tamanho&&!t)?'selected':''} value="${t}">${t||'—'}</option>`).join('')}</select></label>
    <label>Check-outs / checkstands<div style="display:flex;gap:6px"><input id="l-co2" type="number" min="0" value="${l.checkouts??''}" ${d} style="flex:1;min-width:0"><input id="l-cs" type="number" min="0" value="${l.checkstands??''}" ${d} style="flex:1;min-width:0"></div></label>
    <label class="full">Observações<textarea id="l-ob" rows="2" ${d}>${esc(l.obs||'')}</textarea></label></div>${ex?'<button class="btn" id="b-sl" style="margin-top:12px">Salvar dados da loja</button>':''}</div>`}
function ligarDados(l){
  $('#l-pr').onchange=e=>{const p=D.P[e.target.value];if(p?.coord_id)$('#l-co').value=p.coord_id};
  $('#b-sl').onclick=async()=>{$('#b-sl').disabled=true;const r=await rpc('crm_salvar_loja',{p_token:TOK,p:{id:l.id,cidade:$('#l-ci').value,uf:$('#l-uf').value,gerente_nasc:$('#l-gd').value,promotor_marca:$('#l-pm').checked,promotor_marca_obs:$('#l-pmo').value.trim(),gerente_nome:$('#l-gn').value.trim(),gerente_tel:$('#l-gt').value.trim(),promotor_id:$('#l-pr').value,coord_id:$('#l-co').value,tamanho:$('#l-tm').value,checkouts:$('#l-co2').value,checkstands:$('#l-cs').value,obs:$('#l-ob').value}}).catch(()=>({}));
    if(r.ok){toast('Loja salva.');await recarregar();abrirLoja(l.id,'dados')}else{toast('Não consegui salvar.');$('#b-sl').disabled=false}};
}

/* ---------- promotor ---------- */
function vPromotor(){
  const L=D.lojas,feitas=L.filter(l=>!pendente(l)).length;
  return `<div class="minhas"><h1>Olá, ${esc(D.eu.nome.split(' ')[0])}!</h1><p class="sub">Checagem ${FREQ[D.freq]||''} · ${feitas} de ${L.length} lojas em dia.</p>
  ${L.length?L.map(l=>`<button class="loja" data-loja="${l.id}"><div><b>${esc(l.nome)}</b><span class="muted">${esc(l.cidade||'')} ${esc(l.uf||'')} · ${l.ult_sem?'última em '+dataBR(l.ult_sem):'nunca checada'}</span></div>${!pendente(l)?pctPill(l.ult_pct):'<span class="pill p-az">fazer checagem</span>'}</button>`).join(''):'<div class="card vazio"><b>Nenhuma loja atribuída a você</b>Fale com o seu coordenador.</div>'}</div>`;
}

/* ---------- pendências ---------- */
function vPend(){
  const ps=D.pessoas.filter(p=>p.perfil==='promotor').map(p=>({p,f:D.lojas.filter(l=>l.promotor_id===p.id&&pendente(l))})).filter(x=>x.f.length);
  return `<h1>Pendências de checagem</h1><p class="sub">Lojas com promotor sem checagem desde ${dataBR(iniPeriodo())}.</p>
  ${D.eu.perfil==='exec'?`<div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><b>Frequência da checagem:</b><select id="fq" style="border:1px solid var(--linha);border-radius:10px;padding:8px 10px">${Object.entries(FREQ).map(([k,t])=>`<option value="${k}" ${D.freq===k?'selected':''}>${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select><span class="muted">Vale para a cobrança e para a tela dos promotores.</span></div>`:''}
  ${ps.length?`<div class="card"><table class="tc"><tbody>${ps.map(({p,f})=>{const z=telZap(p.telefone);const msg=`Oi, ${p.nome.split(' ')[0]}! Tudo bem? Faltam ${f.length} checagem(ns): ${f.map(l=>l.nome).join(', ')}. Consegue enviar?${p.token?' Seu link: '+linkDe(p.token):''}`;return `<tr><td><b>${esc(p.nome)}</b><div class="muted">${f.map(l=>esc(l.nome)).join(' · ')}</div></td><td class="num">${f.length}</td><td style="text-align:right">${z?`<a class="btn zap peq" target="_blank" rel="noopener" href="https://wa.me/${z}?text=${encodeURIComponent(msg)}">Lembrar no WhatsApp</a>`:'<span class="muted">sem telefone</span>'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="card vazio"><b>Tudo em dia 🎉</b></div>'}`;
}
function ligarPend(){$('#fq')&&($('#fq').onchange=async e=>{const r=await rpc('crm_salvar_config',{p_token:TOK,p_chave:'freq_checagem',p_valor:e.target.value}).catch(()=>({}));if(r.ok){D.freq=e.target.value;toast('Frequência atualizada.');render()}})}

/* ---------- importar dados ---------- */
const IMPS={};
const TIPOS_IMP={
  vendas:{titulo:'Vendas (sell-out)',rpc:'crm_importar_vendas',cols:[['uf','Estado (UF)',/estado|^uf$/,0],['loja','Loja',/^(loja|filial|cod.*loja)/,1],['mes','Mês',/mes|data|periodo|compet/,0],['valor','Valor (R$)',/valor|fatur|receita|vendas?$|r\$/,0],['vol','Volume',/volume|peso|kg|ton/,0],['categoria','Categoria',/categ/,0],['sku','SKU / produto',/sku|produto|material|cod.*prod/,0]]},
  sku:{titulo:'Estoque por produto (base semanal Mondelez)',rpc:'crm_importar_estoque_sku',cols:[['loja','Loja (Filial)',/^(filial|loja)/,1],['uf','Estado',/estado|^uf$/,0],['bandeira','Bandeira',/bandeira/,0],['categoria','Categoria',/categ/,1],['produto','Produto',/produto|descri/,1],['ean','Código de barras',/barra|ean/,0],['venda','Venda 30 dias (un)',/vendid/,0],['estoque','Estoque atual (un)',/estoque/,1],['dde','DDE',/^dde/,0],['idade','Dias desde a entrada (Idade)',/idade/,0],['grade','Grade seção',/grade/,0],['mix','Mix ativo',/mix/,0]]},
  estoque:{titulo:'Estoque por categoria (formato antigo)',rpc:'crm_importar_estoque',cols:[['loja','Loja',/^(loja|filial|cod.*loja)/,1],['data','Data da leitura',/data|semana|atualiza/,1],['categoria','Categoria',/categ/,0],['unidades','Estoque (unidades)',/estoque|qtd|quant|unid|saldo/,1],['grade','Grade (nº de SKUs)',/grade|mix|sku/,0]]}};
function vImp(){return `<h1>Importar dados</h1><p class="sub">Suba as planilhas do sistema. A chave é a loja (número ou "17 - MATEUS…"). Carregar o mesmo período de novo substitui os números, não duplica. Lojas que ainda não existem no CRM são criadas automaticamente.</p>
  ${Object.entries(TIPOS_IMP).map(([k,t])=>`<div class="card"><h2>${t.titulo}</h2><input type="file" accept=".xlsx,.xls,.csv" data-imp="${k}"><div id="imp-${k}"></div></div>`).join('')}
  <div class="card"><h2>Recalcular diagnósticos</h2><p class="muted" style="margin:0 0 10px">Feito automaticamente depois de cada importação. Use se algo parecer desatualizado.</p><button class="btn sec" id="b-rec">Recalcular agora</button> <span class="muted" id="rec-st"></span></div>`}
function ligarImp(){
  document.querySelectorAll('[data-imp]').forEach(i=>i.onchange=async e=>{const k=i.dataset.imp,f=e.target.files[0];if(!f)return;const box=$('#imp-'+k);box.innerHTML='<p class="muted">Lendo arquivo… (planilhas grandes levam alguns segundos)</p>';
    try{await xlsxLib();const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null,raw:true});if(!rows.length)throw 0;IMPS[k]={rows,cols:Object.keys(rows[0]),nome:f.name};mapaImp(k)}catch(x){box.innerHTML='<p style="color:var(--ruim)">Não consegui ler esse arquivo.</p>'}});
  $('#b-rec').onclick=async()=>{$('#rec-st').textContent='Recalculando…';const r=await rpc('crm_recalcular',{p_token:TOK}).catch(()=>({}));$('#rec-st').textContent=r.ok?`Pronto: ${r.lojas} lojas.`:'Falhou, tente de novo.';if(r.ok)recarregar()};
}
function xlsxLib(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const norm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function mapaImp(k){const I=IMPS[k],T=TIPOS_IMP[k],box=$('#imp-'+k);const dNome=(String(I.nome||'').match(/(\d{4})[-_.](\d{2})[-_.](\d{2})/)||[]).slice(1,4).join('-');
  const usado=new Set();const guess=re=>{const c=I.cols.find(c=>re.test(norm(c))&&!usado.has(c));if(c)usado.add(c);return c||''};
  const G={};T.cols.forEach(([id,,re])=>G[id]=guess(re));if(!G.loja)G.loja=guess(/loja|filial/);
  box.innerHTML=`<p class="muted" style="margin:12px 0">${I.rows.length.toLocaleString('pt-BR')} linhas. Confira as colunas:</p><div class="campos">${T.cols.map(([id,lbl,,ob])=>`<label>${lbl}${ob?'':' <span class="muted">(opcional)</span>'}<select data-c="${id}"><option value="">${ob?'— escolha —':'— não tem —'}</option>${I.cols.map(c=>`<option ${c===G[id]?'selected':''}>${esc(c)}</option>`).join('')}</select></label>`).join('')}
    ${k==='sku'?`<label>Data da leitura <span class="muted">(vem do nome do arquivo)</span><input type="date" data-c="datasku" value="${dNome}"></label>`:''}
    ${k==='vendas'?`<label>Unidade do volume<select data-c="un"><option value="kg">kg</option><option value="t" ${/ton/.test(norm(G.vol))?'selected':''}>toneladas</option></select></label><label>Mês para todas as linhas <span class="muted">(se não houver coluna)</span><input type="month" data-c="mesfixo"></label>`:''}</div>
    <div class="tab-scroll" style="max-height:220px;margin-top:12px" data-prev></div><button class="btn" data-go style="margin-top:12px">Importar</button> <span class="muted" data-st></span>`;
  const sel=id=>{const v=box.querySelector(`[data-c="${id}"]`)?.value||'';return v&&I.cols.find(c=>String(c).trim()===v.trim())||v};
  const conv=()=>I.rows.map(r=>{const lr=String(r[sel('loja')]??''),lj=lr.match(/^\s*(\d+)/);const o={loja:lj?lj[1]:null,nome:lr};
    if(k==='vendas'){let v=sel('vol')?numBR(r[sel('vol')]):null;if(v!=null&&sel('un')==='t')v=v*1000;const um=sel('uf')?String(r[sel('uf')]??'').toUpperCase().match(/(?:^|[\s-])([A-Z]{2})(?:[\s-]|$)/):null;Object.assign(o,{uf:um?um[1]:null,mes:sel('mes')?mesDe(r[sel('mes')]):(sel('mesfixo')?sel('mesfixo')+'-01':null),valor:sel('valor')?numBR(r[sel('valor')]):null,volume_kg:v,categoria:sel('categoria')?String(r[sel('categoria')]??'').trim():'',sku:sel('sku')?String(r[sel('sku')]??'').trim():''})}
    else if(k==='sku'){const um=sel('uf')?String(r[sel('uf')]??'').toUpperCase().match(/(?:^|[\s-])([A-Z]{2})(?:[\s-]|$)/):null,mx=sel('mix')?norm(String(r[sel('mix')]??'')):'sim';
      Object.assign(o,{uf:um?um[1]:null,bandeira:sel('bandeira')?String(r[sel('bandeira')]??'').trim():'',categoria:String(r[sel('categoria')]??'').trim(),produto:String(r[sel('produto')]??'').trim().slice(0,120),ean:sel('ean')?String(r[sel('ean')]??'').trim():'',
        venda:sel('venda')?numBR(r[sel('venda')]):null,estoque:numBR(r[sel('estoque')]),dde:sel('dde')?numBR(r[sel('dde')]):null,idade:sel('idade')?numBR(r[sel('idade')]):null,grade:sel('grade')?numBR(r[sel('grade')]):null,mix:/^(s|1|true|y)/.test(mx)})}
    else Object.assign(o,{data:diaDe(r[sel('data')]),categoria:sel('categoria')?String(r[sel('categoria')]??'').trim():'',unidades:numBR(r[sel('unidades')]),grade:sel('grade')?numBR(r[sel('grade')]):null});return o});
  const ok=o=>o.loja&&(k==='vendas'?o.mes:k==='sku'?(o.produto&&o.estoque!=null):o.data&&o.unidades!=null);
  const prevSku=L=>`<table><thead><tr><th>Loja</th><th>Produto</th><th class="num">Estoque</th><th class="num">Venda 30d</th><th class="num">DDE</th><th>Mix</th></tr></thead><tbody>${L.slice(0,8).map(o=>`<tr><td>${o.loja||'<span style="color:var(--ruim)">?</span>'} ${o.uf||''}</td><td>${esc(o.produto)}<div class="muted">${esc(catNome(o.categoria))}</div></td><td class="num">${nf(o.estoque)}</td><td class="num">${nf(o.venda)}</td><td class="num">${o.dde==null?'—':Math.round(o.dde)}</td><td>${o.mix?'Sim':'Não'}</td></tr>`).join('')}</tbody></table>`;
  const prev=()=>{const L=conv(),v=L.filter(ok);if(k==='sku'){box.querySelector('[data-prev]').innerHTML=prevSku(L);const st=box.querySelector('[data-st]');st.textContent=`${v.length.toLocaleString('pt-BR')} linhas válidas · ${new Set(v.map(o=>o.loja)).size} lojas · ${[...new Set(v.map(o=>o.uf).filter(Boolean))].sort().join(', ')}`;return}box.querySelector('[data-prev]').innerHTML=`<table><thead><tr><th>Loja</th>${k==='vendas'?'<th>Mês</th><th>Categoria</th><th class="num">Valor</th><th class="num">Volume (kg)</th>':'<th>Data</th><th>Categoria</th><th class="num">Unidades</th><th class="num">Grade</th>'}</tr></thead><tbody>${L.slice(0,8).map(o=>`<tr><td>${o.loja||'<span style="color:var(--ruim)">?</span>'}</td>${k==='vendas'?`<td>${o.mes?mesBR(o.mes):'?'}</td><td>${esc(catNome(o.categoria))}</td><td class="num">${brl(o.valor)}</td><td class="num">${nf(o.volume_kg)}</td>`:`<td>${o.data?dataBR(o.data):'?'}</td><td>${esc(catNome(o.categoria))}</td><td class="num">${nf(o.unidades)}</td><td class="num">${o.grade??'—'}</td>`}</tr>`).join('')}</tbody></table>`;box.querySelector('[data-st]').textContent=`${v.length.toLocaleString('pt-BR')} linhas válidas${L.length-v.length?' · '+(L.length-v.length)+' ignoradas':''}`};
  box.querySelectorAll('[data-c]').forEach(x=>x.onchange=prev);prev();
  box.querySelector('[data-go]').onclick=async()=>{const L=conv().filter(ok),b=box.querySelector('[data-go]'),st=box.querySelector('[data-st]');if(!L.length){toast('Nenhuma linha válida.');return}
    const dsku=k==='sku'?sel('datasku'):null;if(k==='sku'&&!/^\d{4}-\d{2}-\d{2}$/.test(dsku||'')){toast('Informe a data da leitura.');return}
    b.disabled=true;let tot=0,novas=0;const N=k==='estoque'?400:k==='sku'?900:800;
    if(k==='sku'){const r0=await rpc('crm_estoque_sku_inicio',{p_token:TOK,p_data:dsku}).catch(()=>null);if(!r0?.ok){toast('Sem conexão.');b.disabled=false;return}}
    try{for(let i=0;i<L.length;i+=N){st.textContent=`Enviando ${Math.min(i+N,L.length).toLocaleString('pt-BR')} de ${L.length.toLocaleString('pt-BR')}…`;
        const lote=L.slice(i,i+N).map(({nome,...o})=>({...o,nome:nome.slice(0,90)}));let r=null;for(let t=0;t<3&&!r?.ok;t++){r=await rpc(T.rpc,k==='sku'?{p_token:TOK,p_data:dsku,p_linhas:lote}:{p_token:TOK,p_linhas:lote}).catch(()=>null);if(!r?.ok)await new Promise(z=>setTimeout(z,1500))}if(!r?.ok)throw new Error('lote '+(i/N+1));tot+=r.gravadas;novas+=r.lojas_novas||0}
      if(k==='sku'){st.textContent='Calculando ruptura, parados e grade…';const rf=await rpc('crm_estoque_sku_fechar',{p_token:TOK,p_data:dsku});if(!rf?.ok)throw new Error('fechamento')}
      st.textContent='Atualizando diagnósticos…';await rpc('crm_recalcular',{p_token:TOK});
      st.innerHTML=`<b style="color:var(--ok)">Pronto: ${tot.toLocaleString('pt-BR')} registros gravados.</b>${novas?` ${novas} loja(s) nova(s) criada(s): confira em Mapa do negócio.`:''}`;toast('Importação concluída.');await recarregar();
    }catch(e){st.textContent=`Parou no ${e.message||'envio'} (${tot.toLocaleString('pt-BR')} registros já gravados). Pode importar o mesmo arquivo de novo: não duplica.`}b.disabled=false};
}
function numBR(v){if(v==null||v==='')return null;if(typeof v==='number')return v;let s=String(v).replace(/[R$\s]/g,'');if(/,\d{1,3}$/.test(s)||(s.includes(',')&&s.includes('.')&&s.lastIndexOf(',')>s.lastIndexOf('.')))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const n=parseFloat(s);return isNaN(n)?null:n}
function diaDe(v){if(v==null||v==='')return null;if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return null}
function mesDe(v){const d=diaDe(v);if(d)return d.slice(0,8)+'01';if(v==null)return null;const s=String(v).trim();let m;if(m=s.match(/^(\d{4})[-\/](\d{1,2})$/))return m[1]+'-'+m[2].padStart(2,'0')+'-01';if(m=s.match(/^(\d{1,2})[-\/](\d{4})$/))return m[2]+'-'+m[1].padStart(2,'0')+'-01';
  const ms={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};if(m=norm(s).match(/(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*[\s\/\-.]*(\d{2,4})/)){let y=+m[2];if(y<100)y+=2000;return y+'-'+String(ms[m[1]]).padStart(2,'0')+'-01'}return null}

carregar();
</script>
</body>
</html>
