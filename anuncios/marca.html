<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Geist,sans-serif}
#logo{width:1080px;height:1080px;background:#0b1124;display:grid;place-items:center;position:relative;overflow:hidden}
#logo:before{content:"";position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(91,140,255,.35),transparent 65%);top:-200px;right:-250px}
#logo i{position:relative;width:560px;height:560px;border-radius:150px;background:linear-gradient(135deg,#5b8cff,#2fd6e8);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:380px;color:#0b1124;letter-spacing:-.04em}
#capa{width:1640px;height:624px;background:#0b1124;position:relative;overflow:hidden;color:#e9edfb;display:flex;align-items:center;padding:0 0 0 560px;box-sizing:border-box}
#capa:before{content:"";position:absolute;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(91,140,255,.3),transparent 65%);top:-500px;right:-300px}
#capa:after{content:"";position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(47,214,232,.16),transparent 65%);bottom:-520px;left:200px}
#capa div{position:relative;z-index:1}
#capa h1{margin:0;font-size:78px;font-weight:800;letter-spacing:-.035em;line-height:1.02}
#capa h1 em{font-style:normal;background:linear-gradient(100deg,#5b8cff,#2fd6e8);-webkit-background-clip:text;background-clip:text;color:transparent}
#capa p{margin:20px 0 0;font-size:32px;color:#9aa6c8;font-weight:500}
</style></head><body>
<div id="logo"><i>H</i></div>
<div id="capa"><div><h1>Sites e sistemas<br>para <em>pequenos negócios</em>.</h1><p>Amostra grátis · você só paga depois de ver no ar · helicesites.com.br</p></div></div>
</body></html>
